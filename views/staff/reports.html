<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raporlar — MentorOS</title>
  <style>
    :root {
      --navy: #1a2b5e; --copper: #b5651d; --bg: #f4f5f7; --card: #fff; --border: #dddddd;
      --line: #e6e8ef; --muted: #6b7280; --soft: #eef1f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 24px 60px; background: var(--bg); color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .app-header { background: #fff; border-bottom: 1px solid var(--line); padding: 10px 0; margin: 0 -24px; }
    .app-header-inner { max-width: 1200px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; }
    .app-brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .app-logo { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
                background: linear-gradient(135deg,#101b3f,#3657ff); color: #fff; font-weight: 900; font-size: 20px; }
    .app-name { font-size: 22px; font-weight: 800; color: #101b3f; line-height: 1; }
    .container { max-width: 1200px; margin: 24px auto 0; }
    .top-bar { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px; }
    h1 { color: var(--navy); margin: 0 0 6px; font-size: 28px; }
    .subtitle { color: var(--muted); margin: 0; line-height: 1.5; max-width: 640px; }
    .language-control { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
                        display: flex; align-items: center; gap: 8px; }
    .language-control label { color: var(--muted); font-size: 13px; font-weight: 700; }
    select, input { border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 14px;
                    background: #fff; color: #111827; }
    button { font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 8px; padding: 9px 14px; cursor: pointer;
             border: 1px solid var(--navy); background: var(--navy); color: #fff; }
    button.ghost { background: #fff; color: var(--navy); border-color: #cfd5e6; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
    .tab { background: none; border: none; border-bottom: 3px solid transparent; border-radius: 0; color: var(--muted);
           padding: 10px 14px; font-size: 15px; }
    .tab[aria-selected="true"] { color: var(--navy); border-bottom-color: var(--copper); }

    .toolbar { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex;
               gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .toolbar label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .toolbar .spacer { flex: 1; }

    .report-head h2 { margin: 0; color: var(--navy); font-size: 21px; }
    .report-head .range { color: var(--muted); font-size: 13px; margin-top: 3px; }
    .note { background: #fff8e6; border: 1px solid #ecd49a; color: #6b4e00; border-radius: 10px; padding: 10px 12px;
            font-size: 13px; line-height: 1.5; margin: 12px 0; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin: 14px 0 18px; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .stat .v { font-size: 22px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

    .block { background: #fff; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
    .block-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px;
                  border-bottom: 1px solid var(--line); background: #fafbfd; }
    .block-head h3 { margin: 0; font-size: 15px; color: var(--navy); }
    .block-head .count { font-size: 12.5px; color: var(--muted); }
    .scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); padding: 9px 12px; background: #f7f8fb;
         border-bottom: 1px solid var(--line); white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid #f0f1f5; vertical-align: top; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: none; }
    .empty { padding: 16px 14px; color: var(--muted); font-size: 13.5px; }
    .loading { padding: 30px; text-align: center; color: var(--muted); }
    .err { color: #b91c1c; }
  </style>
</head>
<body>

<div class="app-header">
  <div class="app-header-inner">
    <div class="app-brand" onclick="location.href='/index.html'">
      <div class="app-logo">M</div>
      <div class="app-name">MentorOS</div>
    </div>
  </div>
</div>

<div class="container">
  <div class="top-bar">
    <div>
      <h1 data-i18n="pageTitle">Raporlar</h1>
      <p class="subtitle" data-i18n="subtitle">Yönetim raporu ve anket sonuçları. Her rapor PDF veya Excel olarak indirilebilir.</p>
    </div>
    <div class="language-control">
      <label for="languageSelect" data-i18n="languageLabel">Dil</label>
      <select id="languageSelect" onchange="setLanguage(this.value)">
        <option value="tr">Türkçe</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-report="management" data-i18n="tabManagement">Yönetim Raporu</button>
    <button class="tab" role="tab" data-report="surveys" data-i18n="tabSurveys">Anket Sonuçları</button>
    <button class="tab" role="tab" data-report="events" data-i18n="tabEvents">Etkinlikler</button>
    <button class="tab" role="tab" data-report="person" data-i18n="tabPerson">Kişiye Özel Rapor</button>
    <button class="tab" role="tab" data-report="ai" data-i18n="tabAi">AI Yönetici Özeti</button>
  </div>

  <div class="toolbar">
    <div>
      <label for="from" data-i18n="from">Başlangıç</label>
      <input type="date" id="from">
    </div>
    <div>
      <label for="to" data-i18n="to">Bitiş</label>
      <input type="date" id="to">
    </div>
    <div id="programBox" hidden>
      <label for="programSel" data-i18n="program">Program</label>
      <select id="programSel"></select>
    </div>
    <div id="personBox" hidden>
      <label for="personInput" data-i18n="person">Kişi (sicil no ya da ad soyad)</label>
      <input id="personInput" list="peopleList" autocomplete="off" style="min-width:280px">
      <datalist id="peopleList"></datalist>
    </div>
    <button id="applyBtn" data-i18n="apply">Uygula</button>
    <button id="clearBtn" class="ghost" data-i18n="allTime">Tüm zamanlar</button>
    <span class="spacer"></span>
    <button id="pdfBtn" class="ghost" data-i18n="pdf">PDF indir</button>
    <button id="xlsxBtn" data-i18n="xlsx">Excel indir</button>
  </div>

  <div id="report"><div class="loading" data-i18n="loading">Yükleniyor…</div></div>
</div>

<script src="/assets/report-print.js"></script>
<script src="/assets/xlsx.js"></script>
<script>
/*
 * REPORTS  (routes/reports.js)
 * The server returns each report in one shape - { title, subtitle, notes,
 * summary, tables } - and this page draws the screen, the PDF and the
 * Excel file from that SAME object, so the three always agree.
 */
const $ = id => document.getElementById(id);
const T = {
  tr: {
    pageTitle: "Raporlar", languageLabel: "Dil",
    subtitle: "Yönetim raporu ve anket sonuçları. Her rapor PDF veya Excel olarak indirilebilir.",
    tabManagement: "Yönetim Raporu", tabSurveys: "Anket Sonuçları", tabEvents: "Etkinlikler",
    program: "Program", allPrograms: "Tüm programlar", noProgram: "Programsız",
    screenOnly: "Yalnızca ekranda isimli; PDF ve Excel'de isimsiz",
    from: "Başlangıç", to: "Bitiş", apply: "Uygula", allTime: "Tüm zamanlar",
    pdf: "PDF indir", xlsx: "Excel indir", loading: "Yükleniyor…", failed: "Rapor yüklenemedi",
    showDetail: "Detayları göster", hideDetail: "Detayları gizle", rows: "{n} satır",
    person: "Kişi (sicil no ya da ad soyad)", pickPerson: "Raporu görmek için yukarıdan bir kişi seçin (sicil no ya da ad soyad yazın).",
    personNotFound: "Bu sicil numarasıyla kayıtlı kişi bulunamadı.", roleMentor: "Mentor", roleMentee: "Mentee",
    noExportNote: "Yalnızca ekranda", tabPerson: "Kişiye Özel Rapor", tabAi: "AI Yönetici Özeti",
    pai: {
      title: "Kişiye Özel AI Özeti", generate: "Özeti oluştur", regenerate: "Yeniden oluştur", generating: "Oluşturuluyor…",
      warn: "AI tarafından üretildi. Gelişimi desteklemek içindir; kişi hakkında karar vermek için tek başına kullanılmamalıdır. AI'ya isim, e-posta, sicil no, açık uçlu anket cevapları ve toplantı notları gitmez.",
      off: "AI bu firma için kapalı. Kişiye Özel AI Özeti kullanılamaz.", none: "Bu kişi için henüz özet oluşturulmadı.",
      created: "Oluşturulma", overview: "Genel durum", engagement: "Katılım ve süreklilik", surveys: "Anket görünümü",
      attention: "Dikkat edilmesi gerekenler", actions: "İK için önerilen adımlar",
      showInput: "AI'ya gidecek verileri göster", hideInput: "Gizle",
      confirm: "Bu kişi için yeni bir özet oluşturulsun mu? (AI'ya bir istek gönderilir)", failed: "Özet oluşturulamadı"
    },
    ai: {
      title: "AI Yönetici Özeti", generate: "Özeti oluştur", regenerate: "Yeniden oluştur", generating: "Oluşturuluyor… (birkaç saniye sürebilir)",
      intro: "Seçili tarih aralığı ve program için sistemin hesapladığı sayılardan AI kısa bir yönetici özeti yazar. AI'ya isim, e-posta, sicil no, eşleşme bilgisi ve açık uçlu anket cevapları gitmez; yalnızca sayılar, oranlar ve program adları gider.",
      none: "Henüz özet oluşturulmadı. Filtreleri seçip \"Özeti oluştur\" düğmesine basın.",
      off: "AI bu firma için kapalı. AI Yönetici Özeti kullanılamaz.",
      warn: "Bu metin AI tarafından üretildi. Kararlarda kullanmadan önce aşağıdaki sayılarla karşılaştırarak kontrol edin.",
      created: "Oluşturulma", overview: "Genel değerlendirme", highlights: "Öne çıkan göstergeler", strengths: "Güçlü yönler",
      risks: "Riskler ve dikkat gerektirenler", programmes: "Program bazında değerlendirme", actions: "Önerilen aksiyonlar",
      cProgramme: "Program", cAssessment: "Değerlendirme", cPriority: "Öncelik", cAction: "Aksiyon",
      priority: { high: "Yüksek", medium: "Orta", low: "Düşük" },
      input: "AI'nın kullandığı sayılar", showInput: "AI'ya gidecek verileri göster", hideInput: "Gizle",
      inputNow: "Şu anki filtrelerle AI'ya gidecek veriler", metric: "Gösterge", value: "Değer",
      confirm: "Mevcut özetin yerine yeni bir özet oluşturulsun mu? (AI'ya bir istek gönderilir)", failed: "Özet oluşturulamadı"
    },
    noRows: "Bu aralıkta kayıt yok.", summary: "Özet", metric: "Gösterge", value: "Değer", notesSheet: "Notlar",
    rangeWrong: "Bitiş tarihi başlangıçtan önce olamaz.",
    pageTitleDoc: "Raporlar — MentorOS", confidential: "GİZLİ", files: { management: "Yonetim_Raporu", surveys: "Anket_Sonuclari", events: "Etkinlik_Raporu", person: "Kisi_Raporu" }
  },
  en: {
    pageTitle: "Reports", languageLabel: "Language",
    subtitle: "Management report and survey results. Each report can be downloaded as PDF or Excel.",
    tabManagement: "Management Report", tabSurveys: "Survey Results", tabEvents: "Events",
    program: "Programme", allPrograms: "All programmes", noProgram: "No programme",
    screenOnly: "Named on screen only; anonymous in PDF and Excel",
    from: "From", to: "To", apply: "Apply", allTime: "All time",
    pdf: "Download PDF", xlsx: "Download Excel", loading: "Loading…", failed: "Could not load the report",
    showDetail: "Show details", hideDetail: "Hide details", rows: "{n} rows",
    person: "Person (person no. or name)", pickPerson: "Choose a person above to see the report (type a person number or a name).",
    personNotFound: "No person with this person number.", roleMentor: "Mentor", roleMentee: "Mentee",
    noExportNote: "On screen only", tabPerson: "Person Report", tabAi: "AI Executive Summary",
    pai: {
      title: "Person AI Summary", generate: "Generate summary", regenerate: "Generate again", generating: "Generating…",
      warn: "Written by AI. It is meant to support development; do not use it on its own to decide about the person. No names, e-mails, person numbers, free-text survey answers or meeting notes go to the AI.",
      off: "AI is turned off for this organisation. The Person AI Summary cannot be used.", none: "No summary for this person yet.",
      created: "Created", overview: "Overall", engagement: "Engagement and continuity", surveys: "Survey picture",
      attention: "Points that need attention", actions: "Suggested next steps for HR",
      showInput: "Show what goes to the AI", hideInput: "Hide",
      confirm: "Generate a new summary for this person? (a request is sent to the AI)", failed: "The summary could not be generated"
    },
    ai: {
      title: "AI Executive Summary", generate: "Generate summary", regenerate: "Generate again", generating: "Generating… (this can take a few seconds)",
      intro: "The AI writes a short executive summary from the figures the system works out for the chosen date range and programme. No names, e-mails, person numbers, matches or free-text survey answers go to the AI; only numbers, rates and programme names.",
      none: "No summary yet. Choose the filters and press \"Generate summary\".",
      off: "AI is turned off for this organisation. The AI Executive Summary cannot be used.",
      warn: "This text was written by AI. Check it against the figures below before using it in decisions.",
      created: "Created", overview: "Overall assessment", highlights: "Key figures", strengths: "Strengths",
      risks: "Risks and points that need attention", programmes: "By programme", actions: "Recommended actions",
      cProgramme: "Programme", cAssessment: "Assessment", cPriority: "Priority", cAction: "Action",
      priority: { high: "High", medium: "Medium", low: "Low" },
      input: "The figures the AI used", showInput: "Show what goes to the AI", hideInput: "Hide",
      inputNow: "What goes to the AI with the current filters", metric: "Measure", value: "Value",
      confirm: "Replace the current summary with a new one? (a request is sent to the AI)", failed: "The summary could not be generated"
    },
    noRows: "No records in this range.", summary: "Summary", metric: "Measure", value: "Value", notesSheet: "Notes",
    rangeWrong: "The end date cannot be before the start date.",
    pageTitleDoc: "Reports — MentorOS", confidential: "CONFIDENTIAL", files: { management: "Management_Report", surveys: "Survey_Results", events: "Event_Report", person: "Person_Report" }
  }
};
let LANG = localStorage.getItem("mentorAppLang") || "tr";
if (!T[LANG]) LANG = "tr";
const t = k => (T[LANG][k] ?? T.tr[k] ?? k);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let REPORT = new URLSearchParams(location.search).get("report") || "management";
if (!["management", "surveys", "events", "person", "ai"].includes(REPORT)) REPORT = "management";
let DATA = null;
const OPEN = new Set();          // detail tables opened

function applyStatic() {
  document.documentElement.lang = LANG;
  document.title = t("pageTitleDoc");
  $("languageSelect").value = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.report === REPORT)));
  // Person report: the person picker instead of the programme filter.
  $("personBox").hidden = REPORT !== "person";
  $("programBox").style.display = REPORT === "person" ? "none" : "";
}

function setLanguage(l) {
  LANG = T[l] ? l : "tr";
  localStorage.setItem("mentorAppLang", LANG);
  applyStatic();
  Promise.all([loadPrograms(), loadPeople()]).then(load);       // texts come from the server in the chosen language
}

function query() {
  const p = new URLSearchParams({ lang: LANG });
  if ($("from").value) p.set("from", $("from").value);
  if ($("to").value) p.set("to", $("to").value);
  if (REPORT === "person") p.set("sicil", PERSON);
  else if ($("programSel").value) p.set("programId", $("programSel").value);
  return p.toString();
}

async function load() {
  if ($("from").value && $("to").value && $("to").value < $("from").value) {
    $("report").innerHTML = `<div class="note err">${esc(t("rangeWrong"))}</div>`;
    return;
  }
  $("pdfBtn").disabled = $("xlsxBtn").disabled = true;
  if (REPORT === "ai") return loadAi();
  if (REPORT === "person" && !PERSON) {
    DATA = null;
    $("report").innerHTML = `<div class="note">${esc(t("pickPerson"))}</div>`;
    return;
  }
  $("report").innerHTML = `<div class="loading">${esc(t("loading"))}</div>`;
  try {
    const res = await fetch(`/reports/${REPORT}?${query()}`);
    if (res.status === 401) { location.href = "/login.html"; return; }
    if (res.status === 404 && REPORT === "person") {
      DATA = null;
      $("report").innerHTML = `<div class="note err">${esc(t("personNotFound"))}</div>`;
      return;
    }
    if (!res.ok) throw new Error(res.status);
    DATA = await res.json();
    render();
    $("pdfBtn").disabled = $("xlsxBtn").disabled = false;
  } catch (e) {
    DATA = null;
    $("report").innerHTML = `<div class="note err">${esc(t("failed"))}: ${esc(e.message)}</div>`;
  }
}

function cell(v) {
  return typeof v === "number" ? `<td class="num">${esc(v)}</td>` : `<td>${esc(v)}</td>`;
}

function render() {
  const d = DATA;
  let html = `<div class="report-head"><h2>${esc(d.title)}</h2><div class="range">${esc(d.subtitle)}</div></div>`;
  html += (d.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join("");
  if (d.summary.length) html += `<div class="cards">${d.summary.map(s => `<div class="stat"><div class="v">${esc(s.value)}</div><div class="l">${esc(s.label)}</div></div>`).join("")}</div>`;
  // V09: the person's AI summary sits above the tables (screen only).
  if (REPORT === "person" && d.person) html += `<div id="personAiBox"></div>`;
  for (const tb of d.tables) {
    const closed = tb.detail && !OPEN.has(tb.key);
    const rows = tb.rows;
    html += `<div class="block">
      <div class="block-head"><h3>${esc(tb.title)}</h3>
        <span>
          ${tb.screenOnly ? `<span class="count" style="margin-right:8px">🔒 ${esc(t(tb.noExport ? "noExportNote" : "screenOnly"))}</span>` : ""}
          <span class="count">${esc(t("rows").replace("{n}", tb.rows.length))}</span>
          ${tb.detail && tb.rows.length ? `<button class="ghost" style="margin-left:8px;padding:5px 10px;font-size:12.5px"
              onclick="toggleDetail('${tb.key}')" aria-expanded="${!closed}">${esc(closed ? t("showDetail") : t("hideDetail"))}</button>` : ""}
        </span>
      </div>
      ${closed ? "" : rows.length ? `<div class="scroll"><table>
        <thead><tr>${tb.columns.map((c, i) => `<th${tb.rows.every(r => typeof r[i] === "number" || r[i] === "—") && tb.rows.some(r => typeof r[i] === "number") ? ' style="text-align:right"' : ""}>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(r => `<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody>
      </table></div>` : `<div class="empty">${esc(t("noRows"))}</div>`}
    </div>`;
  }
  $("report").innerHTML = html;
  if (REPORT === "person" && d.person) loadPersonAi(d.person.sicilNo);
}

/* ---------------- Person AI summary (V09) - screen only ---------------- */
let PAI = null, PAI_INPUT = "";
const PA = k => (T[LANG].pai[k] ?? T.tr.pai[k] ?? k);
async function loadPersonAi(sicil) {
  if (!PAI || PAI.sicil !== sicil) {
    PAI_INPUT = "";
    try {
      const res = await fetch(`/reports/person/ai-summary?sicil=${encodeURIComponent(sicil)}`);
      const d = res.ok ? await res.json() : { aiEnabled: false, last: null };
      PAI = { sicil, ...d };
    } catch { PAI = { sicil, aiEnabled: false, last: null }; }
  }
  renderPersonAi();
}
function renderPersonAi() {
  const box = document.getElementById("personAiBox");
  if (!box || !PAI) return;
  const L = PAI.last;
  let inner = `<div class="note" style="margin:0 0 10px">⚠ ${esc(PA("warn"))}</div>`;
  if (!PAI.aiEnabled) {
    inner = `<div class="note err" style="margin:0">${esc(PA("off"))}</div>`;
  } else {
    inner += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <button id="paiGen" class="primary">${esc(L ? PA("regenerate") : PA("generate"))}</button>
        <button id="paiInput" class="ghost">${esc(PAI_INPUT ? PA("hideInput") : PA("showInput"))}</button></div>`;
    if (PAI_INPUT) inner += `<pre style="white-space:pre-wrap;background:#f7f8fa;border:1px solid #e5e7eb;border-radius:8px;padding:10px;font-size:12.5px;max-height:320px;overflow:auto">${esc(PAI_INPUT)}</pre>`;
    if (!L) inner += `<div class="empty" style="padding:12px 0">${esc(PA("none"))}</div>`;
    else {
      const S = L.summary, para = (h, txt) => txt ? `<h4 style="margin:12px 0 4px;color:var(--navy)">${esc(h)}</h4><p style="margin:0;line-height:1.6">${esc(txt)}</p>` : "";
      const lst = (h, arr) => arr.length ? `<h4 style="margin:12px 0 4px;color:var(--navy)">${esc(h)}</h4><ul style="margin:0 0 0 18px">${arr.map(x => `<li style="margin:3px 0">${esc(x)}</li>`).join("")}</ul>` : "";
      inner += `<div class="range" style="margin-bottom:4px">${esc(PA("created"))}: ${esc(new Date(L.createdAt).toLocaleString(LANG === "en" ? "en-GB" : "tr-TR"))}` +
               `${L.filters.from || L.filters.to ? ` · ${esc(L.filters.from || "…")} – ${esc(L.filters.to || "…")}` : ""}</div>` +
               para(PA("overview"), S.overview) + para(PA("engagement"), S.engagement) + para(PA("surveys"), S.surveys) +
               lst(PA("attention"), S.attention) + lst(PA("actions"), S.actions);
    }
  }
  box.innerHTML = `<div class="block"><div class="block-head"><h3>✨ ${esc(PA("title"))}</h3>
      <span class="count">🔒 ${esc(t("noExportNote"))}</span></div><div style="padding:12px 16px">${inner}</div></div>`;
  const g = document.getElementById("paiGen"); if (g) g.onclick = generatePersonAi;
  const i = document.getElementById("paiInput"); if (i) i.onclick = togglePersonAiInput;
}
async function togglePersonAiInput() {
  if (PAI_INPUT) { PAI_INPUT = ""; return renderPersonAi(); }
  try {
    const res = await fetch(`/reports/person/ai-summary/input?${query()}`);   // query() carries sicil
    PAI_INPUT = res.ok ? (await res.json()).text : "";
  } catch { PAI_INPUT = ""; }
  renderPersonAi();
}
async function generatePersonAi() {
  if (PAI.last && !confirm(PA("confirm"))) return;
  const btn = document.getElementById("paiGen"); btn.disabled = true; btn.textContent = PA("generating");
  try {
    const res = await fetch("/reports/person/ai-summary", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sicil: PAI.sicil, from: $("from").value, to: $("to").value, lang: LANG }) });
    if (res.status === 401) { location.href = "/login.html"; return; }
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error([d.error || res.status, d.detail, d.action].filter(Boolean).join("\n"));
    PAI.last = d.summary;
  } catch (e) { alert(`${PA("failed")}:\n${e.message}`); }
  renderPersonAi();
}

function toggleDetail(key) {
  OPEN.has(key) ? OPEN.delete(key) : OPEN.add(key);
  render();
}

/* Tables as they go into the FILES: a screenOnly table (named answers)
   is replaced by its anonymous version - names never leave the screen. */
function exportTables() {
  return DATA.tables.filter(tb => !tb.noExport).map(tb => tb.screenOnly
    ? { ...tb, columns: tb.exportColumns || [], rows: tb.exportRows || [] }
    : tb);
}

/* ---------------- PDF (browser print, assets/report-print.js) ---------------- */
function downloadPdf() {
  if (REPORT === "ai") return downloadAiPdf();
  if (!DATA) return;
  const sections = [];
  (DATA.notes || []).forEach(n => sections.push({ note: n }));
  if (DATA.summary.length) sections.push({ title: t("summary"), rows: DATA.summary.map(s => ({ label: s.label, value: s.value })) });
  for (const tb of exportTables()) {
    sections.push({ title: tb.title, emptyText: t("noRows"),
                    table: { columns: tb.columns, rows: tb.rows.map(r => r.map(v => v == null ? "" : String(v))) } });
  }
  MentorOSPrint.printReport({
    landscape: true,                 // the tables have up to 12 columns
    lang: LANG,
    logoUrl: LOGO_URL,               // the organisation's logo, if it has one
    title: DATA.title,
    subtitle: DATA.subtitle,
    sections,
    footer: `MentorOS - ${DATA.title}${REPORT === "surveys" ? " - " + t("confidential") : ""}`
  });
}

/* ---------------- Excel (assets/xlsx.js, one file per report) ---------------- */
function downloadXlsx() {
  if (!DATA) return;
  const summaryRows = [[t("metric"), t("value")], ...DATA.summary.map(s => [s.label, s.value])];
  const sheets = DATA.summary.length ? [{ name: t("summary"), rows: summaryRows }] : [];
  for (const tb of exportTables()) sheets.push({ name: tb.sheet || tb.title, rows: [tb.columns, ...tb.rows] });
  sheets.push({ name: t("notesSheet"), rows: [[DATA.title], [DATA.subtitle], ...(DATA.notes || []).map(n => [n])] });
  const stamp = new Date().toISOString().slice(0, 10);
  const range = [$("from").value, $("to").value].filter(Boolean).join("_");
  const who = REPORT === "person" && DATA.person ? "_" + DATA.person.sicilNo : "";
  MentorXlsx.download(`${T[LANG].files[REPORT]}${who}${range ? "_" + range : ""}_${stamp}.xlsx`, sheets);
}

let LOGO_URL = "";
fetch("/my-company").then(r => r.ok ? r.json() : null).then(d => { LOGO_URL = (d && d.logo && d.logo.url) || ""; }).catch(() => {});

/* ---------------- Programme filter ---------------- */
async function loadPrograms() {
  try {
    const res = await fetch("/programs");
    const list = res.ok ? await res.json() : [];
    $("programBox").hidden = !list.length;
    const keep = $("programSel").value;
    $("programSel").innerHTML = `<option value="">${esc(t("allPrograms"))}</option>` +
      list.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join("") +
      `<option value="none">${esc(t("noProgram"))}</option>`;
    $("programSel").value = keep;
  } catch { $("programBox").hidden = true; }
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  REPORT = b.dataset.report;
  history.replaceState(null, "", REPORT === "person" && PERSON ? `?report=person&sicil=${encodeURIComponent(PERSON)}` : `?report=${REPORT}`);
  OPEN.clear();
  applyStatic();
  load();
}));
/* ---------------- AI executive summary ---------------- */
let AI = null, AI_INPUT_OPEN = false;
const A = k => (T[LANG].ai[k] ?? T.tr.ai[k] ?? k);
async function loadAi() {
  $("report").innerHTML = `<div class="loading">${esc(t("loading"))}</div>`;
  try {
    const res = await fetch("/reports/ai-summary");
    if (res.status === 401) { location.href = "/login.html"; return; }
    AI = await res.json();
  } catch { AI = { aiEnabled: false, last: null }; }
  renderAi();
}
const ul = list => `<ul style="margin:6px 0 0 18px">${list.map(x => `<li style="margin:3px 0">${esc(x)}</li>`).join("")}</ul>`;
const block = (title, inner, extra = "") => `<div class="block"><div class="block-head"><h3>${esc(title)}</h3>${extra}</div><div style="padding:12px 16px">${inner}</div></div>`;
function inputTables(sections) {
  return sections.map(sec => sec.items
    ? `<h4 style="margin:12px 0 6px;color:var(--navy)">${esc(sec.title)}</h4><div class="scroll"><table><thead><tr><th>${esc(A("metric"))}</th><th>${esc(A("value"))}</th></tr></thead>
       <tbody>${sec.items.map(i => `<tr><td>${esc(i.label)}</td>${cell(i.value)}</tr>`).join("")}</tbody></table></div>`
    : `<h4 style="margin:12px 0 6px;color:var(--navy)">${esc(sec.title)}</h4><div class="scroll"><table><thead><tr>${sec.table.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead>
       <tbody>${sec.table.rows.map(r => `<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody></table></div>`).join("");
}
function renderAi() {
  const L = AI && AI.last;
  let html = `<div class="report-head"><h2>${esc(A("title"))}</h2></div><div class="note">${esc(A("intro"))}</div>`;
  if (!AI || !AI.aiEnabled) {
    $("report").innerHTML = html + `<div class="note err">${esc(A("off"))}</div>`;
    return;
  }
  html += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px">
      <button id="aiGen" class="primary">${esc(L ? A("regenerate") : A("generate"))}</button>
      <button id="aiShowInput" class="ghost">${esc(AI_INPUT_OPEN ? A("hideInput") : A("showInput"))}</button></div>
    <div id="aiInputBox"></div>`;
  if (!L) {
    html += `<div class="empty">${esc(A("none"))}</div>`;
  } else {
    html += `<div class="range" style="margin-bottom:8px">${esc(A("created"))}: ${esc(new Date(L.createdAt).toLocaleString(LANG === "en" ? "en-GB" : "tr-TR"))} · ${esc(L.subtitle)}</div>`;
    html += `<div class="note">⚠ ${esc(A("warn"))}</div>`;
    const S = L.summary;
    html += block(A("overview"), `<p style="margin:0;line-height:1.6">${esc(S.overview)}</p>`);
    if (S.highlights.length) html += block(A("highlights"), ul(S.highlights));
    if (S.strengths.length) html += block(A("strengths"), ul(S.strengths));
    if (S.risks.length) html += block(A("risks"), ul(S.risks));
    if (S.programmes.length) html += block(A("programmes"), `<div class="scroll"><table><thead><tr><th>${esc(A("cProgramme"))}</th><th>${esc(A("cAssessment"))}</th></tr></thead>
      <tbody>${S.programmes.map(p => `<tr><td>${esc(p.programme)}</td><td>${esc(p.assessment)}</td></tr>`).join("")}</tbody></table></div>`);
    if (S.actions.length) html += block(A("actions"), `<div class="scroll"><table><thead><tr><th>${esc(A("cPriority"))}</th><th>${esc(A("cAction"))}</th></tr></thead>
      <tbody>${S.actions.map(a => `<tr><td>${esc(A("priority")[a.priority] || a.priority)}</td><td>${esc(a.action)}</td></tr>`).join("")}</tbody></table></div>`);
    html += block(A("input"), inputTables(L.input || []));
  }
  $("report").innerHTML = html;
  $("pdfBtn").disabled = !L;
  $("xlsxBtn").disabled = true;
  $("aiGen").onclick = generateAi;
  $("aiShowInput").onclick = toggleAiInput;
  if (AI_INPUT_OPEN) showAiInput();
}
async function showAiInput() {
  const box = $("aiInputBox");
  try {
    const res = await fetch(`/reports/ai-summary/input?${query()}`);
    const d = await res.json();
    box.innerHTML = block(A("inputNow"), `<div class="range" style="margin-bottom:6px">${esc(d.subtitle)}</div>` + inputTables(d.sections || []));
  } catch { box.innerHTML = ""; }
}
function toggleAiInput() { AI_INPUT_OPEN = !AI_INPUT_OPEN; renderAi(); }
async function generateAi() {
  if (AI.last && !confirm(A("confirm"))) return;
  const btn = $("aiGen"); btn.disabled = true; btn.textContent = A("generating");
  try {
    const res = await fetch("/reports/ai-summary", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from: $("from").value, to: $("to").value, programId: $("programSel").value, lang: LANG }) });
    if (res.status === 401) { location.href = "/login.html"; return; }
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error([d.error || res.status, d.detail, d.action].filter(Boolean).join("\n"));
    AI.last = d.summary;
    renderAi();
  } catch (e) {
    alert(`${A("failed")}:\n${e.message}`);
    btn.disabled = false; btn.textContent = AI.last ? A("regenerate") : A("generate");
  }
}
function downloadAiPdf() {
  const L = AI && AI.last; if (!L) return;
  const S = L.summary, list = arr => ({ rows: arr.map((x, i) => ({ label: String(i + 1), value: x })) });
  const sections = [{ note: A("warn") }, { title: A("overview"), note: S.overview }];
  if (S.highlights.length) sections.push({ title: A("highlights"), ...list(S.highlights) });
  if (S.strengths.length) sections.push({ title: A("strengths"), ...list(S.strengths) });
  if (S.risks.length) sections.push({ title: A("risks"), ...list(S.risks) });
  if (S.programmes.length) sections.push({ title: A("programmes"), table: { columns: [A("cProgramme"), A("cAssessment")], rows: S.programmes.map(p => [p.programme, p.assessment]) } });
  if (S.actions.length) sections.push({ title: A("actions"), table: { columns: [A("cPriority"), A("cAction")], rows: S.actions.map(a => [A("priority")[a.priority] || a.priority, a.action]) } });
  for (const sec of L.input || []) {
    sections.push(sec.items
      ? { title: `${A("input")} — ${sec.title}`, table: { columns: [A("metric"), A("value")], rows: sec.items.map(i => [i.label, String(i.value)]) } }
      : { title: `${A("input")} — ${sec.title}`, table: { columns: sec.table.columns, rows: sec.table.rows.map(r => r.map(v => v == null ? "" : String(v))) } });
  }
  MentorOSPrint.printReport({ landscape: false, lang: LANG, logoUrl: LOGO_URL, title: A("title"),
    subtitle: `${L.subtitle} · ${A("created")}: ${new Date(L.createdAt).toLocaleString(LANG === "en" ? "en-GB" : "tr-TR")}`,
    sections, footer: `MentorOS - ${A("title")}` });
}

/* ---------------- Person picker (person report) ---------------- */
let PERSON = new URLSearchParams(location.search).get("sicil") || "", PEOPLE = [];
const personLabel = p => `${p.sicilNo} · ${p.name} (${p.roles.map(r => t(r === "mentor" ? "roleMentor" : "roleMentee")).join(", ")})`;
async function loadPeople() {
  try {
    const res = await fetch("/reports/people");
    PEOPLE = res.ok ? await res.json() : [];
  } catch { PEOPLE = []; }
  $("peopleList").innerHTML = PEOPLE.map(p => `<option value="${esc(personLabel(p))}"></option>`).join("");
  const cur = PEOPLE.find(p => p.sicilNo === PERSON);
  $("personInput").value = cur ? personLabel(cur) : "";
}
/* The typed text -> a person: a chosen list entry, an exact person number or one name match. */
function pickPerson() {
  const v = $("personInput").value.trim();
  const lower = v.toLocaleLowerCase("tr");
  const found = PEOPLE.find(p => personLabel(p) === v) || PEOPLE.find(p => p.sicilNo === v) ||
    (() => { const m = PEOPLE.filter(p => p.name.toLocaleLowerCase("tr") === lower); return m.length === 1 ? m[0] : null; })();
  if (!found) return;
  PERSON = found.sicilNo;
  $("personInput").value = personLabel(found);
  history.replaceState(null, "", `?report=person&sicil=${encodeURIComponent(PERSON)}`);
  OPEN.clear();
  load();
}
$("personInput").addEventListener("change", pickPerson);
$("personInput").addEventListener("keydown", e => { if (e.key === "Enter") pickPerson(); });

$("applyBtn").onclick = load;
$("clearBtn").onclick = () => { $("from").value = ""; $("to").value = ""; load(); };
$("programSel").onchange = load;
$("pdfBtn").onclick = downloadPdf;
$("xlsxBtn").onclick = downloadXlsx;


applyStatic();
Promise.all([loadPrograms(), loadPeople()]).then(load);
</script>
<script src="/assets/company-logo.js" data-staff></script>
