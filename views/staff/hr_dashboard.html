<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İK Paneli — MentorOS</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --navy: #1a2b5e;
      --copper: #b5651d;
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #dddddd;
      --muted: #6b7280;
      --soft: #eef1f8;
      --green: #0f9f6e;
      --red: #d9534f;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      padding: 0 24px 24px;
      color: #1a1a1a;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto 0;
    }

    .app-header {
      background: #ffffff;
      border-bottom: 1px solid #e6e8ef;
      padding: 10px 0;
    }

    .app-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #1a2b5e;
      font-size: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    h1 {
      color: var(--navy);
      margin-bottom: 6px;
      font-size: 28px;
    }

    .subtitle {
      color: var(--muted);
      margin-bottom: 0;
      line-height: 1.5;
    }

    .language-control {
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      margin-bottom: 16px;
    }

    .language-control label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .language-control select {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 7px 10px;
      font-family: inherit;
      color: var(--navy);
      font-weight: 700;
      background: white;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .stat-number {
      font-size: 28px;
      font-weight: 800;
      color: var(--navy);
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .section-title {
      color: var(--navy);
      margin: 26px 0 12px;
      font-size: 20px;
    }

    .card {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .pair-title {
      font-size: 16px;
      color: #111827;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
      display: inline-block;
    }

    .active, .approved {
      background: #dcfce7;
      color: #166534;
    }

    .completed {
      background: #e5e7eb;
      color: #374151;
    }

    .pending {
      background: #fef3c7;
      color: #92400e;
    }

    .rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .paused, .cancelled {
      background: #e5e7eb;
      color: #374151;
    }

    button {
      background: var(--navy);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      font-family: inherit;
    }

    button:hover { opacity: 0.92; }

    .secondary-btn {
      background: var(--soft);
      color: var(--navy);
    }

    .mail-btn {
      background: #0f766e;
      border: 1px solid #0f766e;
      color: #fff;
    }
    .mail-btn:hover:not(:disabled) { filter: brightness(1.15); }
    .mail-btn:disabled { opacity: .6; cursor: default; }

    .danger-btn {
      background: #fff;
      border: 1px solid #dc2626;
      color: #dc2626;
    }
    .danger-btn:hover {
      background: #fef2f2;
    }

    .green-btn {
      background: var(--green);
      color: white;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .empty {
      background: white;
      border: 1px dashed #cbd5e1;
      color: var(--muted);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .loading {
      background: white;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
    }

    @media (max-width: 720px) {
      body { padding: 16px; }
      h1 { font-size: 23px; }
      .top-bar { align-items: stretch; }
      .language-control { justify-content: space-between; width: 100%; }
      .row { align-items: flex-start; }
      .actions button { width: 100%; }
    }

    body {
      padding-top: 0 !important;
    }

    /* ---------- Kapanis anketi ---------- */

    .survey-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px dashed #dfe3ee;
    }

    .survey-label { font-size: 13px; font-weight: 600; }

    .survey-panel {
      background: #f8fafc;
      border: 1px solid #dbe2f3;
      border-radius: 10px;
      padding: 16px 18px;
      margin-top: 12px;
    }

    .survey-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      background: #eef1f8;
      border-radius: 8px;
      padding: 11px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #3a4055;
    }

    .survey-stats b { color: #1a2b5e; }

    .survey-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .survey-col {
      background: #fff;
      border: 1px solid #e3e7f1;
      border-radius: 9px;
      padding: 14px 15px;
    }

    .survey-col h4 {
      margin: 0 0 3px;
      color: #1a2b5e;
      font-size: 14.5px;
    }

    .survey-who { font-size: 12.5px; color: #6b7280; margin-bottom: 11px; }

    .survey-state {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 9px;
      margin-bottom: 10px;
    }

    .survey-state.completed { background: #e7f4ec; color: #2f7d4f; }
    .survey-state.pending   { background: #fff4e5; color: #96601d; }
    .survey-state.not_sent  { background: #eef0f4; color: #6b7280; }

    .survey-sec {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #b5651d;
      margin: 14px 0 7px;
    }

    .survey-q { margin-bottom: 10px; }

    .survey-q .qq {
      font-size: 12.5px;
      color: #5b6172;
      line-height: 1.45;
      margin-bottom: 2px;
    }

    .survey-q .aa {
      font-size: 13.5px;
      color: #1f2430;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .survey-score {
      display: inline-block;
      background: #1a2b5e;
      color: #fff;
      font-weight: 700;
      font-size: 12.5px;
      padding: 2px 9px;
      border-radius: 8px;
    }

    @media (max-width: 760px) {
      .survey-cols { grid-template-columns: 1fr; }
    }

    /* ---------- Meeting tracking ---------- */

    .section-sub { color: var(--muted); font-size: 13px; margin: -6px 0 12px; }
    .track-wrap {
      background: white; border: 1px solid var(--border); border-radius: 14px;
      overflow-x: auto; margin-bottom: 8px;
    }
    .track-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .track-table th {
      text-align: left; font-size: 12.5px; font-weight: 600; color: var(--muted);
      padding: 11px 14px; background: #f7f8fb; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .track-table td { padding: 10px 12px; border-bottom: 1px solid #eef0f5; vertical-align: middle; white-space: nowrap; }
    .track-table tr.track-row { cursor: pointer; }
    .track-table tr.track-row:hover td { background: #fafbfd; }
    .track-table tr.track-row:focus-visible { outline: 2px solid var(--navy); outline-offset: -2px; }
    /* the widest column may wrap; dates and times stay on one line */
    .track-table .pair { color: var(--navy); font-weight: 600; white-space: normal; min-width: 210px; }
    .track-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .pill {
      display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px;
      border-radius: 999px; background: #eef0f4; color: #5b6172; white-space: nowrap;
    }
    .pill.ok { background: #e7f4ec; color: #2f7d4f; }
    .pill.warn { background: #fff4e5; color: #96601d; }
    .track-detail td { background: #fafbfd; padding: 10px 14px 14px 30px; }
    .track-meetings { display: flex; flex-wrap: wrap; gap: 6px; }
    .track-meetings span {
      font-size: 12.5px; background: white; border: 1px solid var(--border);
      border-radius: 7px; padding: 4px 9px; font-variant-numeric: tabular-nums;
    }
    .track-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .stat-card.flag .stat-number { color: #96601d; }
  </style>
</head>

      rejected: "reddedildi",
      completed: "tamamlandı",
      paused: "duraklatıldı",
      cancelled: "iptal edildi"
    }
  }
};

function t(key) {
  return translations[currentLanguage][key] || translations.en[key] || key;
}

function statusText(value) {
  const status = String(value || "pending");
  return (translations[currentLanguage].status && translations[currentLanguage].status[status]) || status;
}

function setLanguage(lang) {
  currentLanguage = translations[lang] ? lang : "en";
  localStorage.setItem("mentorAppLang", currentLanguage);
  document.documentElement.lang = currentLanguage;
  document.getElementById("languageSelect").value = currentLanguage;
  applyTranslations();
  renderProgramFilter();
  renderMentorships();
  renderTracking();
}

function applyTranslations() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });
  document.title = t("pageTitle") + " — MentorOS";
}

async function loadDashboard() {
  // Butonlarin gosterilip gosterilmeyecegini belirler.
  await checkSmtp();

  try {
    const mentorshipRes = await fetch(
      `${API_BASE_URL}/mentorships?companyId=${COMPANY_ID}`,
      { headers: { "x-api-key": API_KEY } }
    );

    if (!mentorshipRes.ok) throw new Error(t("couldNotLoadMentorships"));

    mentorships = await mentorshipRes.json();

    await loadPrograms();
    renderMentorships();
    await loadTracking();

  } catch (error) {
    document.getElementById("errorBox").innerHTML = `
      <div class="error">${escapeHtml(error.message)}</div>
    `;
  }
}

/* ==================================================================
   KAPANIS ANKETLERI

   Gonderim ve sonuc goruntuleme. Cevaplari YALNIZCA bu ekran gosterir;
   mentor ve mentee birbirinin cevabini goremez.
   ================================================================== */

/** Mentor veya mentee'ye anket gonderir. */
async function sendSurvey(mentorshipId, role, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("surveySending");

  try {
    const res = await fetch(`${API_BASE_URL}/mentorships/${mentorshipId}/survey`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
      body: JSON.stringify({ role, language: currentLanguage })
    });

    const data = await res.json().catch(() => ({}));

    if (data.group) {
      // Group: one survey per member - list who got it and who did not.
      // A member whose e-mail failed still has a survey: their link is shown.
      const lines = [];
      if (data.sent.length) lines.push(`${t("surveySent")} ${data.sent.map(x => x.name).join(", ")}`);
      if (data.skipped.length) lines.push(`${t("surveyAlreadyDoneBy")} ${data.skipped.map(x => x.name).join(", ")}`);
      if (data.failed.length) lines.push(`${t("surveySendFailed")}:\n` +
        data.failed.map(x => `${x.name}: ${x.reason}${x.surveyUrl ? "\n  " + x.surveyUrl : ""}`).join("\n"));
      alert(lines.join("\n\n"));
      const panel = document.getElementById(`surveyBox-${mentorshipId}`);
      if (panel && panel.innerHTML.trim()) showSurveyAnswers(mentorshipId, true);
      return;
    }

    if (!res.ok) {
      // Bilinen durumlar icin AÇIK mesaj ver; ham hata metni IK'ya
      // bir sey anlatmaz.
      if (data.code === "already_completed") throw new Error(t("surveyAlreadyDone"));
      if (data.code === "no_email") throw new Error(t("surveyNoEmail"));

      // SMTP hatasinda anket kaydi yine de olusmustur; linki verelim ki
      // IK elle paylasabilsin.
      if (data.surveyUrl) {
        throw new Error(`${t("surveySendFailed")}: ${data.error}\n\n${data.surveyUrl}`);
      }
      throw new Error(`${t("surveySendFailed")}: ${data.error || res.status}`);
    }

    alert(`${data.reused ? t("surveyResent") : t("surveySent")} ${data.sentTo}`);

    // Panel aciksa durumu tazele.
    const box = document.getElementById(`surveyBox-${mentorshipId}`);
    if (box && box.innerHTML.trim()) showSurveyAnswers(mentorshipId, true);

  } catch (error) {
    alert(error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

/** Cevap panelini acar/kapatir. */
async function showSurveyAnswers(mentorshipId, forceOpen) {
  const box = document.getElementById(`surveyBox-${mentorshipId}`);
  if (!box) return;

  if (box.innerHTML.trim() && !forceOpen) {
    box.innerHTML = "";
    return;
  }

  box.innerHTML = `<div class="survey-panel"><div class="muted">${t("surveyLoading")}</div></div>`;

  try {
    const res = await fetch(
      `${API_BASE_URL}/mentorships/${mentorshipId}/surveys?language=${encodeURIComponent(currentLanguage)}`,
      { headers: { "x-api-key": API_KEY } }
    );

    if (!res.ok) throw new Error();

    const data = await res.json();
    const s = data.stats || {};

    const period = s.firstMeeting && s.lastMeeting
      ? `${s.firstMeeting} → ${s.lastMeeting}` : "—";

    box.innerHTML = `
      <div class="survey-panel">
        <div class="survey-stats">
          <span><b>${s.meetingCount || 0}</b> ${escapeHtml(t("surveyStatsMeetings"))}</span>
          <span><b>${s.doneActions || 0}/${s.totalActions || 0}</b> ${escapeHtml(t("surveyStatsActions"))}</span>
          <span>${escapeHtml(t("surveyStatsPeriod"))}: <b>${escapeHtml(period)}</b></span>
          <span class="muted" style="font-size:11.5px">${escapeHtml(t("surveyStatsNote"))}</span>
        </div>

        <div class="survey-cols">
          ${surveyColumn(data.mentor, t("mentor"), data.mentorName)}
          ${data.isGroup
            ? (data.members || []).map(m => surveyColumn(m, t("groupMember"), m.name)).join("")
            : surveyColumn(data.mentee, t("mentee"), data.menteeName)}
        </div>
      </div>
    `;

  } catch {
    box.innerHTML = `<div class="survey-panel"><div class="muted">${t("surveyLoadFailed")}</div></div>`;
  }
}

/** Tek bir tarafin (mentor/mentee) cevap sutunu. */
function surveyColumn(entry, roleLabel, personName) {
  if (!entry) return "";

  const stateText = {
    completed: t("surveyCompleted"),
    pending: t("surveyPending"),
    not_sent: t("surveyNotSent")
  }[entry.state] || entry.state;

  let body = "";

  if (entry.state === "not_sent") {
    body = `<div class="muted" style="font-size:13px">${escapeHtml(t("surveyNotSentYet"))}</div>`;

  } else if (entry.state === "pending") {
    // Cevap yoksa en azindan linki ver - IK hatirlatirken elle
    // paylasmak isteyebilir.
    body = `
      <div class="muted" style="font-size:13px;margin-bottom:9px">
        ${escapeHtml(t("surveyNoAnswerYet"))}
      </div>
      <div class="muted" style="font-size:12px">
        ${escapeHtml(t("surveySentAt"))}: ${escapeHtml(formatDate(entry.sentAt))}
      </div>
      <button style="margin-top:9px;font-size:12px;padding:6px 11px"
              onclick="copyText('${escapeJs(entry.surveyUrl || "")}')">
        ${escapeHtml(t("surveyCopyLink"))}
      </button>`;

  } else {
    const def = entry.definition;
    const answers = entry.answers || {};

    body = `
      <div class="muted" style="font-size:12px;margin-bottom:4px">
        ${escapeHtml(t("surveyCompletedAt"))}: ${escapeHtml(formatDate(entry.completedAt))}
      </div>
      ${(def ? def.sections : []).map(section => `
        <div class="survey-sec">${escapeHtml(section.title)}</div>
        ${section.questions.map(q => renderAnswer(q, answers[q.id])).join("")}
      `).join("")}`;
  }

  return `
    <div class="survey-col">
      <h4>${escapeHtml(roleLabel)}</h4>
      <div class="survey-who">${escapeHtml(personName || entry.recipientName || "—")}</div>
      <span class="survey-state ${escapeHtml(entry.state)}">${escapeHtml(stateText)}</span>
      ${body}
    </div>`;
}

/** Tek soru + cevabi. Cevaplanmamis soru "—" olarak gosterilir. */
function renderAnswer(q, value) {
  const empty = value === undefined || value === null || value === "";

  let shown;
  if (empty) {
    shown = `<span class="muted">—</span>`;
  } else if (q.type === "scale5") {
    shown = `<span class="survey-score">${escapeHtml(String(value))}/5</span>`;
  } else if (q.type === "nps") {
    shown = `<span class="survey-score">${escapeHtml(String(value))}/10</span>`;
  } else {
    shown = escapeHtml(String(value));
  }

  return `
    <div class="survey-q">
      <div class="qq">${escapeHtml(q.q)}</div>
      <div class="aa">${shown}</div>
    </div>`;
}

/* ==================================================================
   E-POSTA GONDERIMI

   Butonlar SADECE SMTP yapilandirilmissa gorunur. Yapilandirilmamissa
   IK bos bir butona basip hata almasin - buton hic cikmasin.
   ================================================================== */

let SMTP_READY = false;

async function checkSmtp() {
  try {
    const res = await fetch(`${API_BASE_URL}/email/status`, {
      headers: { "x-api-key": API_KEY }
    });
    SMTP_READY = res.ok && (await res.json()).configured;
  } catch {
    SMTP_READY = false;
  }
}

async function sendEmail(url, body, btn, okLabel, onDone) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = t("emailSending");

  try {
    const res = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY
      },
      body: JSON.stringify({ ...body, lang: currentLanguage || "tr" })
    });

    const data = await res.json();

    if (!res.ok) {
      // Sunucu teshis dondurduyse IK'ya NE YAPACAGINI soyle.
      const parts = [data.error || t("emailFailed")];
      if (data.detail) parts.push(data.detail);
      if (data.action) parts.push("\n" + t("whatToDo") + " " + data.action);
      throw new Error(parts.join("\n"));
    }

    // Kismi basarisizlik: bazilari gitti, bazilari gitmedi.
    if (data.failed && data.failed.length) {
      const reasons = data.failed
        .map(f => `${f.type || f.email}: ${f.reason}`)
        .join("\n");

      alert(`${data.message}\n\n${t("emailNotSent")}\n${reasons}`);
      btn.textContent = original;
      btn.disabled = false;
      return;
    }

    btn.textContent = okLabel;
    if (onDone) onDone();
    setTimeout(() => {
      btn.textContent = original;
      btn.disabled = false;
    }, 2500);

  } catch (e) {
    alert(e.message);
    btn.textContent = original;
    btn.disabled = false;
  }
}


function emailWorkspace(mentorshipId, btn) {
  sendEmail(
    `${API_BASE_URL}/email/workspace/${mentorshipId}`,
    { target: "both" },
    btn,
    t("emailSent"),
    () => setTimeout(loadDashboard, 1200)    // show "sent" on the card
  );
}

/* ==================================================================
   SILME
   Her silme ONAY ISTER. Geri alinamaz islemlerde ne kaybedilecegi
   acikca yazilir - "emin misiniz?" tek basina yeterli degildir.
   ================================================================== */


async function deleteMentorship(id, label) {
  if (!confirm(`${t("confirmDeleteMentorship")}\n\n${label}`)) return;

  try {
    let res = await fetch(`${API_BASE_URL}/mentorships/${id}`, {
      method: "DELETE",
      headers: { "x-api-key": API_KEY }
    });

    let data = await res.json();

    // Sunucu toplanti notlarini uyardiysa IKINCI kez onay al.
    // Kullanici ne kaybedecegini bilmeden silmemeli.
    if (res.status === 409 && data.code === "has_meetings") {
      if (!confirm(`${data.warning}\n\n${t("confirmDeleteAnyway")}`)) return;

      res = await fetch(`${API_BASE_URL}/mentorships/${id}?force=true`, {
        method: "DELETE",
        headers: { "x-api-key": API_KEY }
      });
      data = await res.json();
    }

    if (!res.ok) throw new Error(data.error || t("deleteFailed"));

    await loadDashboard();

  } catch (e) {
    alert(t("deleteFailed") + ": " + e.message);
  }
}

async function saveClosingDate(id, btn) {
  const input = document.getElementById("closing-" + id);
  const value = input ? input.value : "";
  const original = btn.textContent;

  btn.disabled = true;
  btn.textContent = t("saving");

  try {
    const res = await fetch(`${API_BASE_URL}/mentorships/${id}/closing-date`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json", "x-api-key": API_KEY },
      body: JSON.stringify({ closingDate: value })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || t("closingDateSaveFailed"));

    // Yerel state'i guncelle ki liste yeniden cizilirse dogru gorunsun.
    const ms = mentorships.find(m => m.id === id);
    if (ms) ms.closingDate = data.closingDate;

    btn.textContent = value ? t("closingDateSaved") : t("closingDateCleared");
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1600);

  } catch (e) {
    alert(t("closingDateSaveFailed") + ": " + e.message);
    btn.textContent = original;
    btn.disabled = false;
  }
}

function openWorkspace(id) {
  // Calisma alani artik TOKEN ister. Linki sunucudan alalim -
  // frontend'in token uretmesi mumkun degil (ve olmamali).
  const ms = (mentorships || []).find(m => m.id === id);

  if (ms && ms.workspaceUrl) {
    window.open(ms.workspaceUrl, "_blank");
  } else {
    alert("Calisma alani baglantisi bulunamadi. Sayfayi yenileyip tekrar deneyin.");
  }
}

function openLink(url) {
  window.open(url, "_blank");
}

function copyText(text) {
  navigator.clipboard.writeText(text);
  alert(t("copied"));
}

function formatDate(value) {
  if (!value) return "-";
  const d = new Date(value);
  if (isNaN(d.getTime())) return value;

  return d.toLocaleDateString(currentLanguage === "tr" ? "tr-TR" : "en-GB", {
    year: "numeric",
    month: "short",
    day: "numeric"
  });
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function escapeJs(value) {
  return String(value || "")
    .replaceAll("\\", "\\\\")
    .replaceAll("'", "\\'")
    .replaceAll('"', "&quot;");
}

/* ==================================================================
   MEETING TRACKING
   Dates and durations only; the server never sends meeting content
   to this screen (GET /meeting-tracking).
   ================================================================== */

var TRACKING = null;   // var: setLanguage() may run before this line
const openTrack = new Set();

async function loadTracking() {
  try {
    const res = await fetch(`${API_BASE_URL}/meeting-tracking?programId=${encodeURIComponent(PROGRAM_FILTER)}`);
    if (!res.ok) throw new Error();
    TRACKING = await res.json();
  } catch {
    TRACKING = false;   // false = failed (null = not loaded yet)
  }
  renderTracking();
}

/** 95 -> "1 sa 35 dk" / "1 h 35 min" */
function formatMinutes(total) {
  if (total == null) return "—";
  const h = Math.floor(total / 60), m = total % 60;
  const H = t("hoursShort"), M = t("minutesShort");
  return h ? `${h} ${H}${m ? ` ${m} ${M}` : ""}` : `${m} ${M}`;
}

function sinceText(days) {
  if (days == null) return `<span class="pill">${escapeHtml(t("noMeetingYet"))}</span>`;
  const silent = TRACKING && days >= TRACKING.silentDays;
  const text = days === 0 ? t("today") : t("daysAgo").replace("{n}", days);
  return `<span class="pill ${silent ? "warn" : "ok"}">${escapeHtml(text)}</span>`;
}

function renderTracking() {
  const statsBox = document.getElementById("trackingStats");
  const tableBox = document.getElementById("trackingTable");
  if (TRACKING === null) return;            // still loading
  if (!TRACKING) {
    statsBox.innerHTML = "";
    tableBox.innerHTML = `<div class="empty">${escapeHtml(t("trackingFailed"))}</div>`;
    return;
  }
  const s = TRACKING.stats;
  const card = (n, label, flag) => `
    <div class="stat-card${flag && n ? " flag" : ""}">
      <div class="stat-number">${n}</div>
      <div class="stat-label">${escapeHtml(label)}</div>
    </div>`;
  statsBox.innerHTML = `<div class="stats-grid">
    ${card(s.total, t("trackTotal"))}
    ${card(s.active, t("trackActive"))}
    ${card(s.completed, t("trackCompleted"))}
    ${card(s.neverMet, t("trackNeverMet"), true)}
    ${card(s.silent, t("trackSilent").replace("{n}", TRACKING.silentDays), true)}
  </div>`;

  if (!TRACKING.rows.length) {
    tableBox.innerHTML = `<div class="empty">${escapeHtml(t("noMentorships"))}</div>`;
    return;
  }

  let rows = "";
  for (const r of TRACKING.rows) {
    const open = openTrack.has(r.id);
    const next = r.nextMeetingDate
      ? `${formatDate(r.nextMeetingDate)}${r.nextMeetingTime ? " " + escapeHtml(r.nextMeetingTime) : ""}` : "—";
    rows += `
      <tr class="track-row" tabindex="0" role="button" aria-expanded="${open}"
          onclick="toggleTrack('${escapeJs(r.id)}')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTrack('${escapeJs(r.id)}')}">
        <td class="pair">${open ? "▾" : "▸"} ${escapeHtml(r.mentorName)} → ${escapeHtml(r.menteeDeleted ? t("deletedMentee") : r.menteeName)}${r.isGroup ? ` <span class="muted" style="font-weight:400">(${escapeHtml(t("group"))}, ${r.memberCount} ${escapeHtml(t("people"))})</span>` : ""}
          ${r.status !== "active" ? `<span class="badge ${escapeHtml(r.status)}" style="margin-left:6px">${escapeHtml(statusText(r.status))}</span>` : ""}</td>
        <td class="num">${r.meetingCount}</td>
        <td class="num">${r.timedCount ? formatMinutes(r.totalMinutes) : "—"}</td>
        <td class="num">${r.avgMinutes != null ? formatMinutes(r.avgMinutes) : "—"}</td>
        <td>${r.firstMeeting ? formatDate(r.firstMeeting) : "—"}</td>
        <td>${r.lastMeeting ? formatDate(r.lastMeeting) : "—"}</td>
        <td>${sinceText(r.daysSinceLast)}</td>
        <td>${next}</td>
      </tr>`;
    if (open) {
      const list = r.meetings.length
        ? r.meetings.map((m, i) =>
            `<span>${i + 1}. ${formatDate(m.date)} · ${m.durationMinutes != null ? formatMinutes(m.durationMinutes) : escapeHtml(t("durationUnknown"))}</span>`).join("")
        : `<span>${escapeHtml(t("noMeetingYet"))}</span>`;
      const untimed = r.meetingCount - r.timedCount;
      rows += `<tr class="track-detail"><td colspan="8">
        <div class="track-meetings">${list}</div>
        ${untimed > 0 && r.timedCount ? `<div class="track-note">${escapeHtml(t("durationPartial").replace("{n}", untimed))}</div>` : ""}
      </td></tr>`;
    }
  }

  tableBox.innerHTML = `<div class="track-wrap"><table class="track-table">
    <thead><tr>
      <th>${escapeHtml(t("colPair"))}</th><th class="num">${escapeHtml(t("colMeetings"))}</th>
      <th class="num">${escapeHtml(t("colTotal"))}</th><th class="num">${escapeHtml(t("colAvg"))}</th>
      <th>${escapeHtml(t("colFirst"))}</th><th>${escapeHtml(t("colLast"))}</th>
      <th>${escapeHtml(t("colSince"))}</th><th>${escapeHtml(t("colNext"))}</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function toggleTrack(id) {
  if (openTrack.has(id)) openTrack.delete(id); else openTrack.add(id);
  renderTracking();
}

/* ==================================================================
   PROGRAMME FILTER
   One filter for the whole page: summary cards, match requests,
   meeting tracking and mentorship cards. Shown only when the
   organisation has programmes. "none" = made without a programme.
   ================================================================== */

var PROGRAMS = [];
var PROGRAM_FILTER = sessionStorage.getItem("dashboardProgram") || "all";

async function loadPrograms() {
  try {
    const res = await fetch(`${API_BASE_URL}/programs`);
    PROGRAMS = res.ok ? await res.json() : [];
  } catch { PROGRAMS = []; }
  if (PROGRAM_FILTER !== "all" && PROGRAM_FILTER !== "none" && !PROGRAMS.some(p => p.id === PROGRAM_FILTER)) {
    PROGRAM_FILTER = "all";
  }
  renderProgramFilter();
}

function renderProgramFilter() {
  const box = document.getElementById("programFilterBox");
  const sel = document.getElementById("programFilter");
  if (!box || !sel) return;
  box.style.display = PROGRAMS.length ? "inline-flex" : "none";
  sel.innerHTML =
    `<option value="all">${escapeHtml(t("programAll"))}</option>` +
    PROGRAMS.map(p => `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join("") +
    `<option value="none">${escapeHtml(t("programNone"))}</option>`;
  sel.value = PROGRAM_FILTER;
}

const inProgramFilter = x => PROGRAM_FILTER === "all" ||
  (PROGRAM_FILTER === "none" ? !x.programId : x.programId === PROGRAM_FILTER);
function shownMentorships() { return mentorships.filter(inProgramFilter); }

function programBadge(programId) {
  const p = programId && PROGRAMS.find(x => x.id === programId);
  return p
    ? `<span class="pill" style="background:#e0e7ff;color:#3730a3;margin-right:8px">${escapeHtml(p.name)}</span>`
    : "";
}

async function onProgramFilter(value) {
  PROGRAM_FILTER = value;
  sessionStorage.setItem("dashboardProgram", value);
  renderMentorships();
  await loadTracking();
}

setLanguage(currentLanguage);
loadDashboard();


</script>
