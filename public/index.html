<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MentorOS — Mentorluk Programı Yönetim Platformu</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --navy: #1a2b5e;
      --copper: #b5651d;
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #e0e0e0;
      --muted: #6b7280;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: #1a1a1a;
      padding: 0 1rem 2rem;
    }

    .container {
      max-width: 1100px;
      margin: 24px auto 0;
    }

    .app-header {
      background: #ffffff;
      border-bottom: 1px solid #e6e8ef;
      padding: 10px 0;
    }

    .app-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #1a2b5e;
      font-size: 16px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .guide-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 14px; border: 1px solid #d6dbe6; border-radius: 10px;
      background: #fff; color: var(--navy); font-weight: 600; font-size: 14px;
      text-decoration: none;
    }
    .guide-link:hover { background: #eef1f7; }

    .language-select {
      background: white;
      color: var(--navy);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.6rem 0.9rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    .hero {
      background: var(--navy);
      color: white;
      padding: 2rem;
      border-radius: 16px;
      margin-bottom: 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      line-height: 1.6;
      max-width: 780px;
      margin: 0 auto;
    }

    /* Four cards a row; every card as tall as its row, the "Open"
       buttons all on the same line at the bottom. */
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1rem;
      align-items: stretch;
    }
    @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px)  { .grid { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      transition: 0.2s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .card-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .info {
      position: relative; flex: 0 0 auto;
      width: 26px; height: 26px; border-radius: 50%;
      background: #e8ecf5; color: var(--navy);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; line-height: 1;
      cursor: help; user-select: none; outline: none; transition: background 0.15s;
    }
    .info:hover, .info.open { background: #d8dfee; }
    .info:focus-visible { box-shadow: 0 0 0 3px rgba(26,43,94,0.25); }
    .info .tip {
      display: none; position: absolute; z-index: 20;
      bottom: calc(100% + 10px); right: -6px;
      width: 280px; max-width: 78vw;
      background: #1a2b5e; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px; line-height: 1.5; font-weight: 400; font-style: normal;
      text-align: left; padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18); cursor: default;
    }
    .info .tip::after {
      content: ""; position: absolute; top: 100%; right: 12px;
      border: 7px solid transparent; border-top-color: #1a2b5e;
    }
    .info:hover .tip, .info:focus .tip, .info.open .tip { display: block; }
    .crumb { margin: 0 0 14px; font-size: 14px; }
    .crumb a { color: var(--navy); text-decoration: none; font-weight: 600; cursor: pointer; }
    .crumb span { color: var(--muted); }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .card button {
      background: var(--copper);
      border: none;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .coming {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="app-header">
    <div class="app-header-inner">     
    <div class="app-brand" onclick="goTo('index.html')" style="cursor:pointer;">
        <div style="
          display:flex;
          align-items:center;
          gap:10px;
        ">
          <div style="
            width:40px;
            height:40px;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#101b3f,#3657ff);
            color:white;
            font-weight:900;
            font-size:20px;
            flex-shrink:0;
          ">
            M
          </div>

          <div>
            <div style="font-size:22px;font-weight:800;color:#101b3f;line-height:1;">MentorOS</div>
            <div style="font-size:11.5px;color:#6b7280;line-height:1.2;margin-top:3px;">Mentorluk Programı Yönetim Platformu</div>
          </div>
        </div>      
    </div>

    </div>
  </div>

  <div class="container">

    <div class="top-bar">
      <!-- User guide (PDF) in the selected language; href set in applyLanguage(). -->
      <a id="guideLink" class="guide-link" href="/guides/user-guide-en.pdf" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i18n="guideLink">User Guide (PDF)</span></a>
      <select id="languageSelect" class="language-select" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
    </div>

    <div class="hero">
      <h1 data-i18n="heroTitle">AI-Guided Mentorship Platform</h1>
      <p data-i18n="heroSubtitle">
        Structure mentorship journeys, guide conversations with AI, and turn meetings into real development actions — all in one system.
      </p>
    </div>

    <div class="crumb" id="crumb" hidden>
      <a onclick="goTo('index.html')" data-i18n="homeLink">← Home</a> <span>/</span> <span data-i18n="adminTitle">Admin</span>
    </div>

    <!-- Cards are listed in CARDS / ADMIN_CARDS below (order = screen order). -->
    <div class="grid" id="grid"></div>

    <div class="footer" data-i18n="footerText">
      Built with AI • Mentorship Platform MVP
    </div>

  </div>

  <script>

    const urlParams = new URLSearchParams(window.location.search);

    const params = new URLSearchParams(window.location.search);
    const COMPANY_ID = "default";   // tek kurulum - firma secimi yok

    const translations = {
      en: {
        pageTitle: "Mentorship Platform",
        heroTitle: "AI-Guided Mentorship Platform",
        heroSubtitle: "Structure mentorship journeys, guide conversations with AI, and turn meetings into real development actions — all in one system.",
        mentorRegistrationTitle: "Mentor Registry",
        mentorRegistrationDesc: "View registered mentors, edit their profiles, and share the invitation link.",
        menteeRegistrationTitle: "Mentee Registry",
        menteeRegistrationDesc: "View registered mentees, edit their profiles, and share the invitation link.",
        menteeMatchingTitle: "Mentee–Mentor Matching",
        adminTitle: "Admin",
        adminDesc: "Programmes, feedback questions, registration forms and organisation settings.",
        homeLink: "← Home",
        menteeMatchingDesc: "Find the most suitable mentors based on development needs and goals.",
        hrDashboardTitle: "HR Dashboard",
        hrDashboardDesc: "Follow mentorships, meetings, feedback and the progress of the programme.",
        programsTitle: "Programmes",
        checkinTitle: "Feedback Questions",
        announcementsTitle: "Announcements",
        eventsTitle: "Events",
        eventsDesc: "Group sessions and trainings with calendar invitations and attendance.",
        reportsTitle: "Reports",
        companySettingsTitle: "Organisation Settings",
        formsTitle: "Registration Forms",
        formsDesc: "Which fields the mentor and mentee forms show, which are required, and their texts.",
        companySettingsDesc: "Your organisation's logo on screens, e-mails and reports.",
        reportsDesc: "Management report and survey results, as PDF or Excel.",
        announcementsDesc: "Send announcements by e-mail to mentors, mentees and groups.",
        checkinDesc: "The questions of the mid-programme feedback sent to mentors and mentees.",
        programsDesc: "Create mentoring programmes with start and end dates; place mentors and mentees into them.",
        openButton: "Open",
        guideLink: "User Guide (PDF)",
        infoLabel: "What is this section?",
        footerText: "Built with AI • Mentorship Platform MVP"
      },
      tr: {
        pageTitle: "Mentorluk Platformu",
        heroTitle: "AI Destekli Mentorluk Platformu",
        heroSubtitle: "Mentorluk yolculuklarını yapılandırın, görüşmeleri AI ile yönlendirin ve toplantıları gerçek gelişim aksiyonlarına dönüştürün — hepsi tek sistemde.",
        mentorRegistrationTitle: "Mentor Kayıtları",
        mentorRegistrationDesc: "Kayıtlı mentorları görüntüleyin, profillerini düzenleyin ve davet bağlantısını paylaşın.",
        menteeRegistrationTitle: "Mentee Kayıtları",
        menteeRegistrationDesc: "Kayıtlı mentee'leri görüntüleyin, profillerini düzenleyin ve davet bağlantısını paylaşın.",
        menteeMatchingTitle: "Mentee-Mentor Eşleştirme",
        adminTitle: "Admin",
        adminDesc: "Programlar, geri bildirim soruları, kayıt formları ve firma ayarları.",
        homeLink: "← Ana sayfa",
        menteeMatchingDesc: "Gelişim ihtiyaçları ve hedeflere göre en uygun mentorları bulun.",
        hrDashboardTitle: "HR Dashboard",
        hrDashboardDesc: "Mentorluk ilişkilerini, toplantıları, geri bildirimleri ve program sürecini takip edin.",
        programsTitle: "Programlar",
        checkinTitle: "Geri Bildirim Soruları",
        announcementsTitle: "Duyurular",
        eventsTitle: "Etkinlikler",
        eventsDesc: "Takvim davetli grup oturumları ve eğitimler; yanıtlar ve katılım.",
        reportsTitle: "Raporlar",
        companySettingsTitle: "Firma Ayarları",
        formsTitle: "Kayıt Formları",
        formsDesc: "Mentor ve mentee formlarında hangi alanlar görünsün, hangileri zorunlu olsun ve alan metinleri.",
        companySettingsDesc: "Firmanızın logosu: ekranlarda, e-postalarda ve raporlarda.",
        reportsDesc: "Yönetim raporu ve anket sonuçları; PDF veya Excel olarak.",
        announcementsDesc: "Mentor, mentee ve gruplara e-posta ile duyuru gönderin.",
        checkinDesc: "Mentor ve mentee'lere gönderilen ara geri bildirimin soruları.",
        programsDesc: "Başlangıç ve bitiş tarihli mentorluk programları oluşturun; mentor ve mentee'leri programlara yerleştirin.",
        openButton: "Aç",
        guideLink: "Kullanım Kılavuzu (PDF)",
        infoLabel: "Bu bölüm nedir?",
        footerText: "AI ile geliştirildi • Mentorluk Platformu MVP"
      }
    };

    let currentLanguage = localStorage.getItem("mentorAppLang") || "en";

    function setLanguage(language) {
      currentLanguage = translations[language] ? language : "en";
      localStorage.setItem("mentorAppLang", currentLanguage);
      applyLanguage();
    }

    function applyLanguage() {
      const t = translations[currentLanguage] || translations.en;
      document.documentElement.lang = currentLanguage;
      document.title = t.pageTitle + " — MentorOS";

      const languageSelect = document.getElementById("languageSelect");
      if (languageSelect) languageSelect.value = currentLanguage;
      const guideLink = document.getElementById("guideLink");
      if (guideLink) guideLink.href = `/guides/user-guide-${currentLanguage === "tr" ? "tr" : "en"}.pdf`;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (t[key]) el.textContent = t[key];
      });
      renderCards();
    }

    // Home: first row the daily work, second row reports and communication,
    // then "Admin" for the settings that are changed now and then.
    const CARDS = [
      ["mentor_registry.html", "mentorRegistrationTitle", "mentorRegistrationDesc"],
      ["mentee_registry.html", "menteeRegistrationTitle", "menteeRegistrationDesc"],
      ["mentee_matching.html", "menteeMatchingTitle", "menteeMatchingDesc"],
      ["hr_dashboard.html", "hrDashboardTitle", "hrDashboardDesc"],
      ["reports.html", "reportsTitle", "reportsDesc"],
      ["announcements.html", "announcementsTitle", "announcementsDesc"],
      ["events.html", "eventsTitle", "eventsDesc"],
      ["index.html?section=admin", "adminTitle", "adminDesc"]
    ];
    const ADMIN_CARDS = [
      ["programs.html", "programsTitle", "programsDesc"],
      ["checkin_questions.html", "checkinTitle", "checkinDesc"],
      ["registration_forms.html", "formsTitle", "formsDesc"],
      ["company_settings.html", "companySettingsTitle", "companySettingsDesc"]
    ];
    const ADMIN = urlParams.get("section") === "admin";

    function renderCards() {
      const t = translations[currentLanguage] || translations.en;
      const esc = v => String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      document.getElementById("crumb").hidden = !ADMIN;
      document.getElementById("grid").innerHTML = (ADMIN ? ADMIN_CARDS : CARDS).map(([page, title, desc]) => `
        <div class="card" onclick="goTo('${page}')">
          <div class="card-title">${esc(t[title])}</div>
          <div class="card-desc">${esc(t[desc])}</div>
          <div class="card-foot">
            <button>${esc(t.openButton)}</button>
            <span class="info" tabindex="0" role="button" aria-label="${esc(t.infoLabel)}" onclick="toggleInfo(event, this)">i<span class="tip" role="tooltip">${esc((HELP[currentLanguage] || HELP.en)[title] || "")}</span></span>
          </div>
        </div>`).join("");
    }

    // Info icon: hover / keyboard focus shows the tip; a tap toggles it (phones).
    // It never opens the card itself.
    function toggleInfo(e, el) {
      e.stopPropagation();
      const wasOpen = el.classList.contains("open");
      document.querySelectorAll(".info.open").forEach(x => x.classList.remove("open"));
      if (!wasOpen) el.classList.add("open");
    }
    document.addEventListener("click", () => document.querySelectorAll(".info.open").forEach(x => x.classList.remove("open")));

    // Short explanation of each section, shown in the info pop-up.
    const HELP = {
      en: {
        mentorRegistrationTitle: "The list of mentors registered for the programme. Here you view and edit a mentor's profile, capacity and programmes; the registration link to send to mentors is here too.",
        menteeRegistrationTitle: "The list of mentees and their development needs. Here you view and edit mentee records and find the registration link to send to mentees.",
        menteeMatchingTitle: "Where you choose a mentor for a mentee (or a mentee group). AI suggests suitable mentors based on the development need, or you pick the mentor from the list yourself; once matched, a shared workspace opens.",
        hrDashboardTitle: "Follow all ongoing mentorships in one place: status, meetings held (date and duration only), feedback and closing surveys. The match e-mail is sent from here.",
        reportsTitle: "Management report, survey results and event reports, filtered by date. Download as PDF or Excel; downloaded files are anonymous.",
        announcementsTitle: "Write an announcement like an e-mail and send it to mentors, mentees, groups or any address, with attachments. Each person gets their own e-mail; drafts are kept.",
        eventsTitle: "Plan group mentoring, trainings and online sessions. Participants get a calendar invitation and answer from their own link; after the event you mark actual attendance.",
        adminTitle: "Settings you change now and then: programmes, feedback questions, registration forms and organisation settings (logo, default time zone).",
        programsTitle: "Create mentoring programmes with start and end dates. Mentors and mentees are placed into programmes, and matches follow the programme's dates.",
        checkinTitle: "The questions of the mid-programme feedback. The same set goes to mentors and mentees; you send a feedback round whenever you want from the dashboard.",
        formsTitle: "Choose which fields the mentor and mentee registration forms show, which are required, and their TR/EN texts. Fields needed for AI matching stay locked.",
        companySettingsTitle: "Your organisation's logo on screens, e-mails and reports, and the default time zone for events."
      },
      tr: {
        mentorRegistrationTitle: "Programa kayıt olan mentorların listesi. Mentorun profilini, kapasitesini ve programlarını buradan görür ve düzenlersiniz; mentorlara gönderilecek kayıt bağlantısı da burada.",
        menteeRegistrationTitle: "Mentee'lerin ve gelişim ihtiyaçlarının listesi. Mentee kayıtlarını buradan görür ve düzenlersiniz; mentee'lere gönderilecek kayıt bağlantısı da burada.",
        menteeMatchingTitle: "Bir mentee'ye (ya da bir mentee grubuna) mentor seçtiğiniz yer. AI, gelişim ihtiyacına göre uygun mentorları önerir ya da mentoru listeden kendiniz seçersiniz; eşleştirince ortak çalışma sayfası açılır.",
        hrDashboardTitle: "Devam eden tüm mentorlukları tek yerden izleyin: durum, yapılan toplantılar (yalnızca tarih ve süre), geri bildirimler ve kapanış anketleri. Eşleşme e-postası da buradan gönderilir.",
        reportsTitle: "Yönetim raporu, anket sonuçları ve etkinlik raporları; tarih filtresiyle. PDF ya da Excel olarak indirin; indirilen dosyalar anonimdir.",
        announcementsTitle: "Duyuruyu e-posta gibi yazıp mentorlara, mentee'lere, gruplara ya da istediğiniz adreslere ekleriyle gönderin. Herkese ayrı e-posta gider; taslaklar saklanır.",
        eventsTitle: "Grup mentorluğu, eğitim ve online oturumlar planlayın. Katılımcılara takvim daveti gider, yanıtlarını kendi bağlantılarından verirler; etkinlikten sonra gerçek katılımı işaretlersiniz.",
        adminTitle: "Ara sıra değiştirilen ayarlar: programlar, geri bildirim soruları, kayıt formları ve firma ayarları (logo, varsayılan saat dilimi).",
        programsTitle: "Başlangıç ve bitiş tarihli mentorluk programları oluşturun. Mentor ve mentee'ler programlara yerleştirilir; eşleşmeler programın tarihlerine göre ilerler.",
        checkinTitle: "Program ortasında istenen geri bildirimin soruları. Aynı set mentor ve mentee'ye gider; geri bildirim turunu istediğiniz zaman Dashboard'dan gönderirsiniz.",
        formsTitle: "Mentor ve mentee kayıt formlarında hangi alanların görüneceğini, hangilerinin zorunlu olacağını ve TR/EN metinlerini seçin. AI eşleştirmesi için gereken alanlar kilitli kalır.",
        companySettingsTitle: "Firmanızın ekranlarda, e-postalarda ve raporlarda görünen logosu ve etkinlikler için varsayılan saat dilimi."
      }
    };

    function goTo(page) {
      const target = new URL(page, window.location.href);
      target.searchParams.set("company", COMPANY_ID);
      window.location.href = target.toString();
    }

    applyLanguage();
  </script>



<script src="/assets/company-logo.js" data-staff></script>
</body>
</html>
