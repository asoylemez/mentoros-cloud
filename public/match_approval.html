<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentorship Approval</title>

<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f5f7;
    padding: 0 16px 40px;
    color: #1a1a1a;
  }

  .container {
    max-width: 680px;
    margin: 32px auto 0;
  }

  .app-header {
    background: #ffffff;
    border-bottom: 1px solid #e6e8ef;
    padding: 10px 0;
  }

  .app-header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    align-items: center;
  }

  .app-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    color: #1a2b5e;
    font-size: 16px;
  }

  .card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    border: 1px solid #e5e7eb;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 18px;
  }

  h2 {
    margin: 0 0 8px;
    color: #1a2b5e;
    font-size: 24px;
  }

  .subtitle {
    margin: 0;
    color: #6b7280;
    font-size: 14px;
    line-height: 1.5;
  }

  .language-select {
    min-width: 130px;
    padding: 9px 10px;
    border-radius: 10px;
    border: 1px solid #d1d5db;
    background: #fff;
    color: #1a2b5e;
    font-weight: 600;
    cursor: pointer;
  }

  .content-box {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
  }

  .row {
    margin-bottom: 14px;
    font-size: 15px;
    line-height: 1.5;
  }

  .row:last-child { margin-bottom: 0; }

  .label {
    display: block;
    font-weight: 700;
    color: #6b7280;
    margin-bottom: 4px;
    font-size: 13px;
  }

  .value {
    color: #1f2937;
    font-weight: 500;
  }

  .status-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
  }

  .status-card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 12px;
  }

  .status {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    text-transform: capitalize;
  }

  .pending { background: #fff3cd; color: #856404; }
  .approved { background: #d4edda; color: #155724; }
  .rejected { background: #f8d7da; color: #721c24; }

  .btn-row {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }

  button {
    flex: 1;
    padding: 13px;
    border-radius: 10px;
    border: none;
    font-weight: 700;
    cursor: pointer;
    font-size: 15px;
  }

  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .approve {
    background: #0f9f6e;
    color: white;
  }

  .reject {
    background: #d9534f;
    color: white;
  }

  .info {
    margin-top: 20px;
    padding: 14px;
    background: #eef1f8;
    color: #1a2b5e;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
  }

  .workspace-link {
    display: inline-block;
    margin-top: 12px;
    padding: 10px 16px;
    background: #0f9f6e;
    color: white;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 700;
  }

  .error {
    color: #721c24;
    background: #f8d7da;
    border-radius: 12px;
    padding: 14px;
  }

  @media (max-width: 640px) {
    body { padding: 24px 12px; }
    .top-bar { flex-direction: column; }
    .language-select { width: 100%; }
    .status-grid { grid-template-columns: 1fr; }
    .btn-row { flex-direction: column; }
  }

  body {
    padding-top: 0 !important;
  }


</style>

</head>

<body>

  <div class="app-header">
    <div class="app-header-inner">
      
      <div class="app-brand" onclick="window.location.href='/index.html?company=' + encodeURIComponent(COMPANY_ID)" style="cursor:pointer;">
        <div style="
          display:flex;
          align-items:center;
          gap:10px;
        ">
          <div style="
            width:40px;
            height:40px;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
            background:linear-gradient(135deg,#101b3f,#3657ff);
            color:white;
            font-weight:900;
            font-size:20px;
            flex-shrink:0;
          ">
            M
          </div>

          <div style="
            font-size:22px;
            font-weight:800;
            color:#101b3f;
            line-height:1;
          ">
            MentorOS
          </div>
        </div>  
        
      </div>

    </div>
  </div>  

<div class="container">
  <div class="card">

    <div class="top-bar">
      <div>
        <h2 data-i18n="pageTitle">Mentorship Approval</h2>
        <p class="subtitle" id="pageSubtitle" data-i18n="pageSubtitle">Review this mentorship request and approve or reject the match.</p>
      </div>

      <select id="languageSelect" class="language-select" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
    </div>

    <div id="content" class="content-box" data-i18n="loading">Loading...</div>

    <div class="btn-row" id="actionButtons">
      <button class="approve" id="approveBtn" onclick="approve()" data-i18n="approveButton">Approve</button>
      <button class="reject" id="rejectBtn" onclick="reject()" data-i18n="rejectButton">Reject</button>
    </div>

    <div id="info" class="info" style="display:none;"></div>

  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const COMPANY_ID = "default";   // tek kurulum - firma secimi yok
const id = params.get("id");
const type = params.get("type");
const token = params.get("token") || "";

const API_BASE_URL = window.location.origin;


let currentData = null;
let currentLanguage = localStorage.getItem("mentorAppLang") || "en";

const translations = {
  en: {
    pageTitle: "Mentorship Approval",
    pageSubtitle: "Review this mentorship request and approve or reject the match.",
    loading: "Loading...",
    mentor: "Mentor",
    mentee: "Mentee",
    mentorStatus: "Mentor Status",

    rejectTitle: "Why are you declining?",
    rejectSubtitle: "A short reason helps HR improve future matches. It is not sent to the AI and is only visible to HR.",
    rejectNoteLabel: "Additional note (optional)",
    rejectNotePlaceholder: "Anything that would help HR",
    confirmRejectButton: "Decline the match",
    cancelButton: "Cancel",
    chooseReason: "Please choose a reason.",
    explainOther: "You selected 'Other' — please add a short explanation.",

    reason_timing: "Timing isn't right at the moment",
    reason_priority: "This isn't the current development priority",
    reason_workload: "Workload doesn't allow it right now",
    reason_capacity: "I don't have capacity for another mentee",
    reason_not_my_area: "This isn't really my area of expertise",
    reason_different_mentor: "A different mentor would be a better fit",
    reason_other: "Other (please explain below)",
    managerStatus: "Manager Approval",
    managerName: "Mentee's manager",
    waitingManagerTitle: "Waiting for the manager's approval",
    waitingManagerText: "This match first needs approval from the mentee's manager. You will be able to respond once they have approved.",
    menteeStatus: "Mentee Status",
    approveButton: "Approve",
    rejectButton: "Reject",
    approving: "Approving...",
    rejecting: "Rejecting...",
    pending: "Pending",
    approved: "Approved",
    rejected: "Rejected",
    dataLoadError: "Error loading approval request. Please check the link or try again later.",
    missingLinkInfo: "Approval request ID is missing in the link.",
    responseRecorded: "Your response has been recorded ✅",
    mentorshipReady: "🎉 Mentorship is ready!",
    goToWorkspace: "Go to Workspace",
    updateError: "Error updating approval. Please try again.",
    bothApproved: "🎉 Both sides approved! Mentorship has started.",
    alreadyRejected: "This mentorship request has been rejected.",
    developmentNeed: "Development Need"
  },
  tr: {
    pageTitle: "Mentorluk Onayı",
    pageSubtitle: "Bu mentorluk talebini inceleyin ve eşleşmeyi onaylayın ya da reddedin.",
    loading: "Yükleniyor...",
    mentor: "Mentor",
    mentee: "Mentee",
    mentorStatus: "Mentor Onay Durumu",

    rejectTitle: "Neden reddediyorsunuz?",
    rejectSubtitle: "Kısa bir gerekçe, İK'nın sonraki eşleşmeleri iyileştirmesine yardımcı olur. Yapay zekaya gönderilmez, yalnızca İK görür.",
    rejectNoteLabel: "Ek açıklama (isteğe bağlı)",
    rejectNotePlaceholder: "İK'ya yardımcı olacak herhangi bir not",
    confirmRejectButton: "Eşleşmeyi Reddet",
    cancelButton: "Vazgeç",
    chooseReason: "Lütfen bir gerekçe seçin.",
    explainOther: "'Diğer' seçtiniz — kısa bir açıklama ekleyin.",

    reason_timing: "Şu an zamanlaması uygun değil",
    reason_priority: "Şu anki gelişim önceliği bu değil",
    reason_workload: "İş yükü şu an buna izin vermiyor",
    reason_capacity: "Yeni bir mentee için kapasitem yok",
    reason_not_my_area: "Bu tam olarak benim uzmanlık alanım değil",
    reason_different_mentor: "Farklı bir mentor daha uygun olur",
    reason_other: "Diğer (aşağıda açıklayın)",
    managerStatus: "Yönetici Onayı",
    managerName: "Mentee'nin yöneticisi",
    waitingManagerTitle: "Yöneticinin onayı bekleniyor",
    waitingManagerText: "Bu eşleşme için önce mentee'nin yöneticisinin onayı gerekiyor. O onayladıktan sonra siz de yanıt verebileceksiniz.",
    menteeStatus: "Mentee Onay Durumu",
    approveButton: "Onayla",
    rejectButton: "Reddet",
    approving: "Onaylanıyor...",
    rejecting: "Reddediliyor...",
    pending: "Bekliyor",
    approved: "Onaylandı",
    rejected: "Reddedildi",
    dataLoadError: "Onay talebi yüklenirken hata oluştu. Lütfen bağlantıyı kontrol edin veya daha sonra tekrar deneyin.",
    missingLinkInfo: "Bağlantıda onay talebi ID bilgisi eksik.",
    responseRecorded: "Yanıtınız kaydedildi ✅",
    mentorshipReady: "🎉 Mentorluk hazır!",
    goToWorkspace: "Workspace'e Git",
    updateError: "Onay güncellenirken hata oluştu. Lütfen tekrar deneyin.",
    bothApproved: "🎉 İki taraf da onayladı! Mentorluk başladı.",
    alreadyRejected: "Bu mentorluk talebi reddedildi.",
    developmentNeed: "Gelişim İhtiyacı"
  }
};

function t(key) {
  return (translations[currentLanguage] && translations[currentLanguage][key]) || translations.en[key] || key;
}

function setLanguage(lang) {
  currentLanguage = translations[lang] ? lang : "en";
  localStorage.setItem("mentorAppLang", currentLanguage);
  document.documentElement.lang = currentLanguage;
  document.getElementById("languageSelect").value = currentLanguage;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.textContent = t(key);
  });

  if (currentData) {
    renderApproval(currentData);
    checkIfCompleted(currentData);
  }
}

async function load() {
  if (!id) {
    document.getElementById("content").innerHTML = `<div class="error">${escapeHtml(t("missingLinkInfo"))}</div>`;
    document.getElementById("actionButtons").style.display = "none";
    return;
  }

  try {
    const res = await fetch(
      `${API_BASE_URL}/public/approval/${id}?type=${encodeURIComponent(type)}&token=${encodeURIComponent(token)}`,
    );

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || t("dataLoadError"));
    }

    currentData = data;
    renderApproval(data);
    checkIfCompleted(data);

  } catch (err) {
    document.getElementById("content").innerHTML = `<div class="error">${escapeHtml(t("dataLoadError"))}</div>`;
  }
}

function renderApproval(data) {
  document.getElementById("content").innerHTML = `
    <div class="row">
      <span class="label">${escapeHtml(t("mentor"))}</span>
      <span class="value">${escapeHtml(data.mentorName || "-")}</span>
    </div>

    <div class="row">
      <span class="label">${escapeHtml(t("mentee"))}</span>
      <span class="value">${escapeHtml(data.menteeName || "-")}</span>
    </div>

    ${data.developmentNeed ? `
      <div class="row">
        <span class="label">${escapeHtml(t("developmentNeed"))}</span>
        <span class="value">${escapeHtml(data.developmentNeed)}</span>
      </div>
    ` : ""}

    ${data.managerApproval && data.managerApproval !== "not_required" ? `
      <div class="detail-row">
        <span class="label">${escapeHtml(t("managerName"))}</span>
        <span class="value">${escapeHtml(data.managerName || "-")}</span>
      </div>
    ` : ""}

    <div class="status-grid">
      ${data.managerApproval && data.managerApproval !== "not_required" ? `
        <div class="status-card">
          <span class="label">${escapeHtml(t("managerStatus"))}</span>
          <span class="status ${escapeHtml(data.managerApproval)}">${escapeHtml(statusLabel(data.managerApproval))}</span>
        </div>
      ` : ""}

      <div class="status-card">
        <span class="label">${escapeHtml(t("mentorStatus"))}</span>
        <span class="status ${escapeHtml(data.mentorApproval || "pending")}">${escapeHtml(statusLabel(data.mentorApproval))}</span>
      </div>

      <div class="status-card">
        <span class="label">${escapeHtml(t("menteeStatus"))}</span>
        <span class="status ${escapeHtml(data.menteeApproval || "pending")}">${escapeHtml(statusLabel(data.menteeApproval))}</span>
      </div>
    </div>

    ${(type === "mentor" || type === "mentee") && data.managerGateOpen === false ? `
      <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;
           padding:14px 16px;margin-top:16px;font-size:13.5px;color:#92400e;
           line-height:1.55">
        <strong>${escapeHtml(t("waitingManagerTitle"))}</strong><br>
        ${escapeHtml(t("waitingManagerText"))}
      </div>
    ` : ""}
  `;

  // Yonetici onaylamadan mentor/mentee onay veremez - butonlari kapat.
  if ((type === "mentor" || type === "mentee") && data.managerGateOpen === false) {
    const approveBtn = document.getElementById("approveBtn");
    const rejectBtn = document.getElementById("rejectBtn");
    if (approveBtn) { approveBtn.disabled = true; approveBtn.style.opacity = ".45"; }
    if (rejectBtn)  { rejectBtn.disabled = true;  rejectBtn.style.opacity = ".45"; }
  }
}

function statusLabel(status) {
  if (status === "approved") return t("approved");
  if (status === "rejected") return t("rejected");
  return t("pending");
}

async function approve() {
  await update("approved");
}

/* ==================================================================
   RED GEREKCESI

   "Reddedildi" tek basina IK'ya hicbir sey soylemez. Zamanlama mi,
   mentor mu, oncelik mi? Sebep bilinmeden surec iyilestirilemez.

   Kategori + serbest not birlikte alinir:
     kategori -> IK istatistik cikarabilir
     not      -> insanin okuyacagi ayrinti
   ================================================================== */

const REASONS = {
  manager: ["timing", "priority", "workload", "different_mentor", "other"],
  mentor:  ["timing", "capacity", "not_my_area", "different_mentor", "other"],
  mentee:  ["timing", "priority", "different_mentor", "other"]
};

let selectedReason = null;

function reject() {
  selectedReason = null;
  document.getElementById("rejectNote").value = "";
  document.getElementById("rejectError").style.display = "none";

  const box = document.getElementById("reasonOptions");
  const list = REASONS[type] || REASONS.mentee;

  box.innerHTML = list.map(key => `
    <label style="display:flex;align-items:flex-start;gap:9px;padding:11px 13px;
           border:1.5px solid #e5e7eb;border-radius:8px;cursor:pointer;
           font-size:14px;line-height:1.45" data-reason="${key}">
      <input type="radio" name="reason" value="${key}" style="margin-top:2px">
      <span>${escapeHtml(t("reason_" + key))}</span>
    </label>
  `).join("");

  box.querySelectorAll("label").forEach(el => {
    el.onclick = () => {
      selectedReason = el.dataset.reason;
      box.querySelectorAll("label").forEach(x => {
        const on = x.dataset.reason === selectedReason;
        x.style.borderColor = on ? "#1a2b5e" : "#e5e7eb";
        x.style.background = on ? "#f6f7fc" : "#fff";
      });
      document.getElementById("rejectError").style.display = "none";
    };
  });

  document.getElementById("rejectModal").style.display = "block";
}

function closeReject() {
  document.getElementById("rejectModal").style.display = "none";
}

function showRejectError(msg) {
  const el = document.getElementById("rejectError");
  el.textContent = msg;
  el.style.display = "block";
}

async function confirmReject() {
  const note = document.getElementById("rejectNote").value.trim();

  if (!selectedReason) {
    showRejectError(t("chooseReason"));
    return;
  }

  // "Diger" secildiyse aciklama sart - yoksa kategori bilgi tasimaz.
  if (selectedReason === "other" && note.length < 5) {
    showRejectError(t("explainOther"));
    return;
  }

  const btn = document.getElementById("confirmRejectBtn");
  btn.disabled = true;
  btn.textContent = t("rejecting");

  closeReject();
  await update("rejected", selectedReason, note);

  btn.disabled = false;
  btn.textContent = t("confirmRejectButton");
}

async function update(status, rejectionCategory, rejectionNote) {
  const approveBtn = document.getElementById("approveBtn");
  const rejectBtn = document.getElementById("rejectBtn");

  try {
    approveBtn.disabled = true;
    rejectBtn.disabled = true;

    if (status === "approved") approveBtn.textContent = t("approving");
    if (status === "rejected") rejectBtn.textContent = t("rejecting");

    const res = await fetch(`${API_BASE_URL}/public/approval/${id}`, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
              },
      body: JSON.stringify({ type, status, token, rejectionCategory, rejectionNote })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || t("updateError"));
    }

    document.getElementById("info").style.display = "block";

    let html = escapeHtml(t("responseRecorded"));

    if (data.workspaceUrl) {
      const workspaceUrl = data.workspaceUrl.startsWith("http")
        ? data.workspaceUrl
        : `${window.location.origin}${data.workspaceUrl}`;

      html += `
        <br><br>
        ${escapeHtml(t("mentorshipReady"))}
        <br>
        <a href="${escapeHtml(workspaceUrl)}" class="workspace-link">
          ${escapeHtml(t("goToWorkspace"))}
        </a>
      `;
    }

    document.getElementById("info").innerHTML = html;

    await load();

  } catch (err) {
    alert(t("updateError"));
  } finally {
    approveBtn.disabled = false;
    rejectBtn.disabled = false;
    approveBtn.textContent = t("approveButton");
    rejectBtn.textContent = t("rejectButton");
  }
}

function checkIfCompleted(data) {
  const info = document.getElementById("info");

  if (data.mentorApproval === "approved" && data.menteeApproval === "approved") {
    info.style.display = "block";
    info.innerHTML = escapeHtml(t("bothApproved"));
  }

  if (data.mentorApproval === "rejected" || data.menteeApproval === "rejected") {
    info.style.display = "block";
    info.innerHTML = escapeHtml(t("alreadyRejected"));
  }
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

setLanguage(currentLanguage);
load();
</script>


<!-- ============ RED GEREKCESI ============
     "Reddedildi" tek basina IK'ya hicbir sey soylemez.
     Zamanlama mi, mentor mu, oncelik mi? Sebep sorulur. -->
<div id="rejectModal" style="display:none;position:fixed;inset:0;z-index:100;
     background:rgba(15,20,35,.55);padding:24px;overflow-y:auto">
  <div style="background:#fff;border-radius:12px;max-width:480px;margin:8vh auto;
       padding:26px 28px;font-family:inherit">

    <h2 style="margin:0 0 6px;color:#1a2b5e;font-size:19px"
        data-i18n="rejectTitle">Why are you declining?</h2>
    <p style="color:#6b7280;font-size:13px;margin:0 0 18px;line-height:1.5"
       data-i18n="rejectSubtitle">
      A short reason helps HR improve future matches. It is not sent to the AI
      and is only visible to HR.
    </p>

    <div id="reasonOptions" style="display:flex;flex-direction:column;gap:8px"></div>

    <label style="display:block;font-size:12px;color:#6b7280;margin:16px 0 5px"
           data-i18n="rejectNoteLabel">Additional note (optional)</label>
    <textarea id="rejectNote" rows="3" maxlength="500"
              style="width:100%;padding:10px 12px;border:1px solid #e0e0e0;
                     border-radius:6px;font:inherit;font-size:14px;resize:vertical"
              data-i18n-placeholder="rejectNotePlaceholder"
              placeholder="Anything that would help HR"></textarea>

    <div id="rejectError" style="display:none;color:#dc2626;font-size:13px;
         margin-top:10px"></div>

    <div style="display:flex;justify-content:flex-end;gap:9px;margin-top:20px;
         padding-top:16px;border-top:1px solid #e0e0e0">
      <button type="button" onclick="closeReject()"
              style="padding:10px 18px;border:1px solid #e0e0e0;background:#fff;
                     border-radius:6px;cursor:pointer;font:inherit;font-size:14px"
              data-i18n="cancelButton">Cancel</button>
      <button type="button" id="confirmRejectBtn" onclick="confirmReject()"
              style="padding:10px 20px;border:1px solid #dc2626;background:#dc2626;
                     color:#fff;border-radius:6px;cursor:pointer;font:inherit;
                     font-size:14px;font-weight:600"
              data-i18n="confirmRejectButton">Decline the match</button>
    </div>
  </div>
</div>

</body>
</html>
