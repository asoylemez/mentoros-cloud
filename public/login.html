<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MentorOS Cloud — Giriş</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #111827;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.25);
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 15px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 12px;
      background: #fee2e2;
      color: #991b1b;
      font-size: 14px;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">MentorOS</div>
    <div class="subtitle">
      Kuruluşunuza ait mentorluk alanına giriş yapın.<br/>
      <span style="font-size:13px">Sign in to your organisation's mentoring workspace.</span>
    </div>

    <form id="loginForm">
      <label for="username">Kullanıcı adı / Username</label>
      <input id="username" type="text" required placeholder="kurulus-adi"
             autocapitalize="off" autocorrect="off" spellcheck="false" />

      <label for="password">Şifre / Password</label>
      <input id="password" type="password" placeholder="Şifrenizi girin" required />

      <button type="submit">Giriş / Sign in</button>

      <div id="errorBox" class="error"></div>
    </form>

    <div class="footer">
      MentorOS Cloud
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    const NEXT = new URLSearchParams(window.location.search).get("next") || "";


    document.getElementById("loginForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorBox = document.getElementById("errorBox");

      errorBox.style.display = "none";
      errorBox.textContent = "";

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            username,
            password
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          const err = new Error(data.error || "Giriş başarısız / Login failed");
          err.detail = data.detail;
          throw err;
        }

        /**
         * Super admin firma paneline degil yonetim ekranina gider.
         * Ayrica "next" adresi ona ait olmayabilir - o yuzden sunucunun
         * soyledigi hedefi kullaniyoruz.
         */
        if (data.isSuperAdmin) {
          window.location.href = data.redirect || "/super_admin.html";
          return;
        }

        window.location.href = NEXT || "/index.html";

      } catch (error) {
        errorBox.innerHTML = "";
        errorBox.appendChild(document.createTextNode(
          error.message || "Giriş başarısız / Login failed"));

        if (error.detail) {
          const d = document.createElement("div");
          d.style.cssText = "margin-top:6px;font-size:13px;opacity:.85";
          d.textContent = error.detail;
          errorBox.appendChild(d);
        }

        errorBox.style.display = "block";
      }
    });
  </script>
</body>
</html>
