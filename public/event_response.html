<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etkinlik daveti</title>
  <!--
    A participant's answer to an event invitation (stage 6a). Opened with
    a personal token from the invitation e-mail; no sign-in. The time is
    shown in the event's own time zone and, when different, in the
    reader's own local time too.
  -->
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1f2430;
    }

    .topbar {
      background: #ffffff;
      border-bottom: 1px solid #e4e6ee;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px; height: 28px;
      border-radius: 7px;
      background: #1a2b5e;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }

    .brand { font-weight: 700; color: #1a2b5e; font-size: 16px; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 26px 16px 60px; }

    .header {
      background: #1a2b5e;
      color: #fff;
      border-radius: 12px 12px 0 0;
      padding: 26px 28px;
    }

    .header h1 { margin: 0 0 7px; font-size: 22px; }
    .header p { margin: 0; opacity: 0.9; font-size: 14px; line-height: 1.6; }

    .card {
      background: #fff;
      border: 1px solid #e4e6ee;
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 24px 28px 28px;
    }

    .privacy {
      background: #f0f7f2;
      border: 1px solid #c9e3d2;
      border-radius: 9px;
      padding: 13px 15px;
      font-size: 13.5px;
      line-height: 1.6;
      color: #2c5c3e;
      margin: 0 0 22px;
    }

    .section { margin-bottom: 26px; }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #b5651d;
      margin-bottom: 14px;
      padding-bottom: 7px;
      border-bottom: 1px solid #eceef4;
    }

    .q { margin-bottom: 20px; }

    .q-text {
      font-size: 15px;
      font-weight: 600;
      color: #1a2b5e;
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .q-hint {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 9px;
      line-height: 1.5;
    }

    .optional {
      font-weight: 400;
      color: #9aa1b1;
      font-size: 13px;
    }

    /* --- 1-5 olcek --- */

    .scale {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 8px;
    }

    .scale button {
      background: #fff;
      border: 1px solid #d6dae6;
      border-radius: 9px;
      padding: 11px 4px 9px;
      cursor: pointer;
      font-family: inherit;
      text-align: center;
      transition: all 0.12s;
    }

    .scale button:hover { border-color: #1a2b5e; }

    .scale button.on {
      background: #1a2b5e;
      border-color: #1a2b5e;
      color: #fff;
    }

    .scale .num { font-size: 17px; font-weight: 700; display: block; }
    .scale .lbl { font-size: 10.5px; line-height: 1.3; display: block; margin-top: 3px; opacity: 0.85; }

    /* --- 0-10 --- */

    .nps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .nps button {
      flex: 1 1 52px;
      background: #fff;
      border: 1px solid #d6dae6;
      border-radius: 8px;
      padding: 11px 0;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }

    .nps button:hover { border-color: #1a2b5e; }
    .nps button.on { background: #1a2b5e; border-color: #1a2b5e; color: #fff; }

    /* --- secenek --- */

    .choice { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    .choice button {
      background: #fff;
      border: 1px solid #d6dae6;
      border-radius: 9px;
      padding: 11px 20px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }

    .choice button:hover { border-color: #1a2b5e; }
    .choice button.on { background: #1a2b5e; border-color: #1a2b5e; color: #fff; }

    textarea {
      width: 100%;
      min-height: 96px;
      padding: 12px 13px;
      border: 1px solid #d6dae6;
      border-radius: 9px;
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      color: #1f2430;
    }

    textarea:focus { border-color: #1a2b5e; box-shadow: 0 0 0 3px rgba(26,43,94,0.07); }

    .submit {
      width: 100%;
      background: #b5651d;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 6px;
    }

    .submit:hover { background: #9d5518; }
    .submit:disabled { background: #b9bdc9; cursor: not-allowed; }

    .note {
      background: #fffbf5;
      border: 1px solid #f3e0c8;
      border-radius: 9px;
      padding: 13px 15px;
      color: #8a5a2b;
      font-size: 13.5px;
      line-height: 1.6;
      margin-top: 14px;
    }

    .state {
      background: #fff;
      border: 1px solid #e4e6ee;
      border-radius: 12px;
      padding: 44px 30px;
      text-align: center;
    }

    .state h2 { color: #1a2b5e; margin: 0 0 10px; font-size: 20px; }
    .state p { color: #5b6172; font-size: 14.5px; line-height: 1.65; margin: 0; }

    .tick {
      width: 54px; height: 54px;
      border-radius: 50%;
      background: #e7f4ec;
      color: #2f7d4f;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }

    @media (max-width: 560px) {
      .card, .header { padding-left: 18px; padding-right: 18px; }
      .scale { grid-template-columns: repeat(5, 1fr); gap: 4px; }
      .scale .lbl { display: none; }
      .scale button { padding: 13px 2px; }
    }
  </style>
  <style>
    textarea { width: 100%; min-height: 84px; border: 1px solid #d7dae3; border-radius: 8px;
               padding: 10px 12px; font: inherit; font-size: 14px; resize: vertical; margin-top: 8px; }
    .lang { margin-left: auto; }
    .lang select { padding: 5px 8px; border-radius: 7px; border: 1px solid #d7dae3; font: inherit; font-size: 13px; }
    .q.missing .q-text { color: #b42318; }
    .note:empty { display: none; }
  </style>

  <style>
    .rows { margin: 14px 0 6px; font-size: 14.5px; line-height: 1.7; }
    .rows b { color: #1a2b5e; display: inline-block; min-width: 92px; }
    .answer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .answer button { padding: 14px; border-radius: 10px; border: 1px solid #d7dae3; background: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .answer button.on.yes { background: #15803d; border-color: #15803d; color: #fff; }
    .answer button.on.no { background: #b91c1c; border-color: #b91c1c; color: #fff; }
    .current { margin-top: 12px; font-size: 13.5px; color: #4b5563; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="logo">M</div>
    <div class="brand">MentorOS</div>
    <div class="lang"><select id="lang" aria-label="Language"><option value="tr">Türkçe</option><option value="en">English</option></select></div>
  </div>
  <div class="wrap" id="app"><div class="state"><p>…</p></div></div>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const T = {
  tr: {
    title: "Etkinlik daveti", hello: n => n ? `Merhaba ${n}, aşağıdaki etkinliğe davetlisiniz.` : "Aşağıdaki etkinliğe davetlisiniz.",
    date: "Tarih", time: "Saat", local: "Sizin saatinizle", place: "Yer", online: "Online", about: "Açıklama",
    q: "Katılabilecek misiniz?", yes: "Katılacağım", no: "Katılamayacağım", note: "Not (isteğe bağlı)",
    send: "Yanıtı gönder", sending: "Gönderiliyor…", pick: "Lütfen bir seçenek işaretleyin.",
    current: { pending: "Henüz yanıt vermediniz.", accepted: "Yanıtınız: katılacaksınız. İsterseniz değiştirebilirsiniz.", declined: "Yanıtınız: katılamayacaksınız. İsterseniz değiştirebilirsiniz." },
    saved: "Yanıtınız kaydedildi. Teşekkürler!", cancelled: "Bu etkinlik iptal edildi.", reason: "İptal nedeni",
    started: "Bu etkinlik başladı; yanıt artık değiştirilemez.", invalid: "Bağlantı geçersiz", invalidText: "Bu davet bağlantısı geçerli değil.",
    failed: "Gönderilemedi. Lütfen tekrar deneyin.", privacy: "Yanıtınızı yalnızca İnsan Kaynakları görür."
  },
  en: {
    title: "Event invitation", hello: n => n ? `Hello ${n}, you are invited to the event below.` : "You are invited to the event below.",
    date: "Date", time: "Time", local: "Your local time", place: "Place", online: "Online", about: "About",
    q: "Can you attend?", yes: "I will attend", no: "I can't attend", note: "Note (optional)",
    send: "Send answer", sending: "Sending…", pick: "Please choose an option.",
    current: { pending: "You have not answered yet.", accepted: "Your answer: attending. You can change it.", declined: "Your answer: not attending. You can change it." },
    saved: "Your answer has been saved. Thank you!", cancelled: "This event has been cancelled.", reason: "Reason",
    started: "This event has started; the answer can no longer be changed.", invalid: "Invalid link", invalidText: "This invitation link is not valid.",
    failed: "Could not be sent. Please try again.", privacy: "Only HR sees your answer."
  }
};
let LANG = "tr", DATA = null, CHOICE = "";
const t = k => T[LANG][k];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const locale = () => LANG === "en" ? "en-GB" : "tr-TR";
function offsetOf(tz, at) {
  try { return new Intl.DateTimeFormat("en-US", { timeZone: tz, timeZoneName: "shortOffset" }).formatToParts(at).find(p => p.type === "timeZoneName").value; }
  catch { return ""; }
}
function when(tz) {
  const ev = DATA.event, s = new Date(ev.startUtc), e = new Date(ev.endUtc);
  const d = s.toLocaleDateString(locale(), { timeZone: tz, weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const hm = x => x.toLocaleTimeString(locale(), { timeZone: tz, hour: "2-digit", minute: "2-digit" });
  return { date: d, time: `${hm(s)} – ${hm(e)} (${String(tz).split("/").pop().replace(/_/g, " ")}, ${offsetOf(tz, s)})` };
}
function state(title, text) { document.getElementById("app").innerHTML = `<div class="state"><h2>${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}</div>`; }

function render() {
  document.documentElement.lang = LANG; document.title = t("title");
  if (!DATA) return;
  if (DATA === "invalid") return state(t("invalid"), t("invalidText"));
  const ev = DATA.event;
  const own = when(ev.timezone);
  const mine = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const local = mine && offsetOf(mine, new Date(ev.startUtc)) !== offsetOf(ev.timezone, new Date(ev.startUtc)) ? when(mine) : null;
  const closed = ev.status === "cancelled" ? `<div class="privacy" style="background:#fee2e2;border-color:#fecaca;color:#991b1b"><b>${esc(t("cancelled"))}</b>${ev.cancelReason ? `<br>${esc(t("reason"))}: ${esc(ev.cancelReason)}` : ""}</div>`
               : ev.started ? `<div class="privacy"><b>${esc(t("started"))}</b></div>` : "";
  document.getElementById("app").innerHTML = `
    <div class="header"><h1>${esc(ev.title)}</h1><p>${esc(t("hello")(DATA.name))}</p>
      ${DATA.companyName ? `<p style="margin-top:6px"><b>${esc(DATA.companyName)}</b></p>` : ""}</div>
    <div class="card">
      ${closed}
      <div class="rows">
        <div><b>${esc(t("date"))}</b> ${esc(own.date)}</div>
        <div><b>${esc(t("time"))}</b> ${esc(own.time)}</div>
        ${local ? `<div><b>${esc(t("local"))}</b> ${esc(local.date)} · ${esc(local.time)}</div>` : ""}
        ${ev.location ? `<div><b>${esc(t("place"))}</b> ${esc(ev.location)}</div>` : ""}
        ${ev.onlineUrl ? `<div><b>${esc(t("online"))}</b> <a href="${esc(ev.onlineUrl)}" target="_blank" rel="noopener">${esc(ev.onlineUrl)}</a></div>` : ""}
      </div>
      ${ev.description ? `<div style="white-space:pre-wrap;font-size:14px;color:#374151;margin:6px 0 4px">${esc(ev.description)}</div>` : ""}
      ${closed ? "" : `
        <div class="q" style="margin-top:16px"><div class="q-text">${esc(t("q"))}</div>
          <div class="answer">
            <button type="button" class="yes ${CHOICE === "accepted" ? "on" : ""}" onclick="pick('accepted')">${esc(t("yes"))}</button>
            <button type="button" class="no ${CHOICE === "declined" ? "on" : ""}" onclick="pick('declined')">${esc(t("no"))}</button>
          </div>
          <textarea id="note" maxlength="500" placeholder="${esc(t("note"))}" style="width:100%;min-height:70px;margin-top:10px;border:1px solid #d7dae3;border-radius:8px;padding:10px;font:inherit">${esc(DATA.note || "")}</textarea>
        </div>
        <div class="current">${esc(t("current")[DATA.response] || "")}</div>
        <div class="note" id="msg" role="alert"></div>
        <button class="submit" id="send" onclick="sendAnswer()">${esc(t("send"))}</button>`}
      <div class="current" style="margin-top:14px">${esc(t("privacy"))}</div>
    </div>`;
}
window.pick = v => { CHOICE = v; const note = document.getElementById("note"); if (note) DATA.note = note.value; render(); };
window.sendAnswer = async () => {
  if (!CHOICE) { document.getElementById("msg").textContent = t("pick"); return; }
  const btn = document.getElementById("send"); btn.disabled = true; btn.textContent = t("sending");
  try {
    const res = await fetch(`/public/event/${encodeURIComponent(TOKEN)}`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ response: CHOICE, note: document.getElementById("note").value }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.code); }
    DATA.response = CHOICE; DATA.note = document.getElementById("note").value;
    render(); document.getElementById("msg").textContent = t("saved");
  } catch (e) {
    if (e.message === "cancelled" || e.message === "started") return load();
    document.getElementById("msg").textContent = t("failed"); btn.disabled = false; btn.textContent = t("send");
  }
};
document.getElementById("lang").onchange = e => { LANG = e.target.value; render(); };
async function load() {
  try { const res = await fetch(`/public/event/${encodeURIComponent(TOKEN)}`); DATA = res.ok ? await res.json() : "invalid"; }
  catch { DATA = "invalid"; }
  if (DATA !== "invalid") {
    LANG = DATA.event.language === "en" ? "en" : "tr";
    CHOICE = DATA.response === "pending" ? "" : DATA.response;
    if (window.MentorOSLogo) MentorOSLogo.show(DATA.logoUrl);
  }
  document.getElementById("lang").value = LANG;
  render();
}
load();
</script>
<script src="/assets/company-logo.js"></script>
</body>
</html>
